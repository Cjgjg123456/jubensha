<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧遇 - 评价记录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif; }
        body { width: 100vw; height: 100vh; background: url("images/4.jpg") no-repeat center center; background-size: cover; display: flex; padding: 20px; overflow: hidden; }
        .sidebar { width: 280px; height: 100%; background: linear-gradient(180deg, rgba(15,26,58,0.9), rgba(26,42,90,0.9)); border-radius: 20px; padding: 40px 20px; display: flex; flex-direction: column; backdrop-filter: blur(10px); }
        .sidebar-logo { text-align: center; margin-bottom: 50px; }
        .sidebar-logo h2 { color: #fff; font-size: 42px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .sidebar-logo .star { width: 25px; height: 35px; background: #ff6600; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .menu-list { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .menu-item { width: 100%; height: 60px; background: transparent; border: none; border-radius: 12px; color: #fff; font-size: 18px; display: flex; align-items: center; padding: 0 20px; gap: 15px; cursor: pointer; opacity: 0.7; }
        .menu-item.active { background: linear-gradient(90deg, #ff6600, #ff3300); opacity: 1; }

        .main-content { flex: 1; height: 100%; background: rgba(18, 22, 33, 0.85); backdrop-filter: blur(15px); border-radius: 20px; margin-left: 20px; padding: 40px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.1); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .page-title { font-size: 28px; color: #fff; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 8px; cursor: pointer; color: #fff; transition: 0.3s; }
        .back-btn:hover { background: #ff6600; border-color: #ff6600; }

        .comment-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-right: 10px; }
        .comment-list::-webkit-scrollbar { width: 6px; }
        .comment-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        .comment-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; gap: 15px; transition: 0.3s;}
        .comment-card:hover { border-color: #ff6600; transform: translateY(-2px);}
        .c-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .c-script-info { display: flex; align-items: center; gap: 10px; }
        .c-cover { width: 50px; height: 65px; border-radius: 6px; background: #444; object-fit: cover; }
        .c-title { font-size: 18px; color: #fff; font-weight: bold; margin-bottom: 5px;}
        .c-stars { color: #ffcc00; font-size: 16px; }
        .c-date { color: #888; font-size: 12px; }

        .c-content { color: #ddd; font-size: 14px; line-height: 1.6; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; }
        .c-footer { display: flex; justify-content: flex-end; gap: 15px; color: #888; font-size: 13px; }
        .c-action { cursor: pointer; transition: 0.3s; padding: 5px 10px; border-radius: 5px; background: rgba(255,0,0,0.1); color:#ff4d4f; }
        .c-action:hover { background: #ff4d4f; color: #fff; }
    </style>
</head>
<body>
<div class="sidebar">
    <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:50px;">
        <img src="images/icon.png" alt="logo" style="width:38px; height:38px; border-radius:10px; object-fit:cover; box-shadow: 0 0 10px rgba(255,102,0,0.3);">
        <h2 style="margin:0; font-size:22px; letter-spacing:1px; color:#fff;">古建奇案馆</h2>
    </div>
    <div class="menu-list">
        <button class="menu-item active" onclick="goToProfile()"><span>👤</span><span>个人信息</span></button>
    </div>
</div>

<div class="main-content">
    <div class="header-top">
        <h1 class="page-title">🛡️ 评价记录</h1>
        <button class="back-btn" onclick="goToProfile()">← 返回个人中心</button>
    </div>

    <div class="comment-list" id="dataList">
        <div style="color:#888; text-align:center; padding-top:50px;">加载中...</div>
    </div>
</div>

<script>
    function goToProfile() {
        const username = localStorage.getItem('loginUsername') || '';
        window.location.href = `profile.html?username=${encodeURIComponent(username)}`;
    }

    function formatDate(dateArr) {
        if (!dateArr) return '未知时间';
        if (Array.isArray(dateArr)) return `${dateArr[0]}-${String(dateArr[1]).padStart(2,'0')}-${String(dateArr[2]).padStart(2,'0')} ${String(dateArr[3]||0).padStart(2,'0')}:${String(dateArr[4]||0).padStart(2,'0')}`;
        return new Date(dateArr).toLocaleString();
    }

    // 核心：请求数据并渲染
    async function loadComments() {
        const username = localStorage.getItem('loginUsername');
        const list = document.getElementById('dataList');
        try {
            const res = await fetch(`/api/user/records/comment?username=${encodeURIComponent(username)}`).then(r => r.json());
            if (res.success && res.data && res.data.length > 0) {
                list.innerHTML = res.data.map(item => `
                  <div class="comment-card">
                      <div class="c-header">
                          <div class="c-script-info">
                              <div class="c-cover" style="background: url('${item.cover_url || 'https://placehold.co/50x65/444/ff6600?text=剧本'}') center/cover;"></div>
                              <div>
                                  <div class="c-title">《${item.script_name}》</div>
                                  <div class="c-stars">${'★'.repeat(item.score)}${'☆'.repeat(5 - item.score)}</div>
                              </div>
                          </div>
                          <div class="c-date">${formatDate(item.evaluate_time)}</div>
                      </div>
                      <div class="c-content">${item.content}</div>
                      <div class="c-footer">
                          <span class="c-action" onclick="deleteComment(${item.evaluate_id})">🗑️ 删除评价</span>
                      </div>
                  </div>
                `).join('');
            } else {
                list.innerHTML = '<div style="color:#888; text-align:center; padding-top:50px;">您还没有发布过任何评价哦~</div>';
            }
        } catch (e) {
            list.innerHTML = '<div style="color:red; text-align:center; padding-top:50px;">网络异常</div>';
        }
    }

    // 核心：新增的删除功能
    async function deleteComment(id) {
        if (!confirm('确定要永久删除这条评价吗？')) return;
        try {
            const res = await fetch(`/api/user/records/comment/${id}`, { method: 'DELETE' }).then(r => r.json());
            if (res.success) {
                alert('删除成功！');
                loadComments(); // 刷新列表
            } else {
                alert(res.message || '删除失败');
            }
        } catch (e) {
            alert('网络异常');
        }
    }

    window.onload = loadComments;
</script>
</body>
</html>

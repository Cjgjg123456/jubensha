<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古建奇案馆 - 我的创作</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif; }
        body { width: 100vw; height: 100vh; background: url("images/4.jpg") no-repeat center center; background-size: cover; display: flex; padding: 20px; overflow: hidden; }

        /* 侧边栏样式同 room.html */
        .sidebar { width: 280px; height: 100%; background: linear-gradient(180deg, rgba(15,26,58,0.9), rgba(26,42,90,0.9)); border-radius: 20px; padding: 40px 20px; display: flex; flex-direction: column; backdrop-filter: blur(10px); z-index: 10;}
        .sidebar-logo { text-align: center; margin-bottom: 50px; }
        .menu-list { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .menu-item { width: 100%; height: 60px; background: transparent; border: none; border-radius: 12px; color: #fff; font-size: 18px; display: flex; align-items: center; padding: 0 20px; gap: 15px; cursor: pointer; transition: 0.3s; opacity: 0.7; }
        .menu-item.active { background: linear-gradient(90deg, #ff6600, #ff3300); opacity: 1; box-shadow: 0 5px 15px rgba(255, 102, 0, 0.3); }
        .menu-item:not(.active):hover { opacity: 1; background: rgba(255,255,255,0.1); }
        .btn-create-new { margin-top: auto; padding: 15px; background: linear-gradient(90deg, #00b4db, #0083b0); border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; box-shadow: 0 5px 15px rgba(0,180,219,0.3); }
        .btn-create-new:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,180,219,0.5); }

        .main-content { flex: 1; height: 100%; background: rgba(18, 22, 33, 0.9); backdrop-filter: blur(15px); border-radius: 20px; margin-left: 20px; display: flex; flex-direction: column; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); padding: 40px; }

        /* 标题区域 */
        .section-title { font-size: 24px; font-weight: bold; color: #ff9900; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }

        /* 网格布局 */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; margin-bottom: 40px; }

        /* 系列卡片专属样式 */
        .series-card { height: 160px; border-radius: 15px; position: relative; overflow: hidden; border: 1px solid rgba(0,229,255,0.3); box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;}
        .series-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(0.6) blur(2px); transition: 0.3s; z-index: 1; }
        .series-content { position: relative; z-index: 2; text-align: center; padding: 20px; width: 100%; background: rgba(0,0,0,0.5); height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.3s;}
        .series-card:hover .series-bg { filter: brightness(0.8) blur(0px); transform: scale(1.05); }
        .series-card:hover .series-content { background: rgba(0,0,0,0.3); }
        .series-name { font-size: 22px; font-weight: bold; color: #fff; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .series-desc { font-size: 13px; color: #ccc; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-edit-series { position: absolute; top: 15px; right: 15px; background: rgba(0,229,255,0.8); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; z-index: 10; opacity: 0; transition: 0.3s; backdrop-filter: blur(5px); }
        .series-card:hover .btn-edit-series { opacity: 1; }
        .btn-delete-series { position: absolute; top: 45px; right: 15px; background: rgba(255,51,51,0.8); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; z-index: 10; opacity: 0; transition: 0.3s; backdrop-filter: blur(5px); }
        .series-card:hover .btn-delete-series { opacity: 1; }
        .btn-delete-series:hover { background: rgba(255,0,0,1); }

        /* 剧本卡片样式 (复用 room.html) */
        .script-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 15px; padding: 20px; transition: 0.3s; position: relative; display: block; }
        .script-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); border-color: rgba(255,102,0,0.4); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .card-top { display: flex; gap: 15px; margin-bottom: 15px; position: relative; }
        .card-cover { width: 90px; height: 120px; border-radius: 8px; background-color: #333; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
        .card-info { flex: 1; }
        .c-title { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .c-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .c-tag { background: rgba(255,255,255,0.1); color: #ccc; font-size: 12px; padding: 3px 6px; border-radius: 4px; }
        .card-desc { font-size: 13px; color: #aaa; line-height: 1.6; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 42px; }
        .btn-edit-script { width: 100%; padding: 10px 0; background: rgba(255,153,0,0.1); border: 1px solid #ff9900; color: #ff9900; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.3s; }
        .btn-edit-script:hover { background: #ff9900; color: #fff; }
        
        .edit-badge { position: absolute; top: 15px; right: 15px; background: rgba(255,153,0,0.9); backdrop-filter: blur(5px); border-radius: 14px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 12px; z-index: 10; border: 1px solid #ff9900; padding: 0 12px; white-space: nowrap; color: #fff; font-weight: bold; }
        .edit-badge:hover { transform: scale(1.08); background: rgba(255,102,0,1); box-shadow: 0 2px 8px rgba(255,153,0,0.4); }
        .delete-badge { position: absolute; top: 48px; right: 15px; background: rgba(255,51,51,0.9); backdrop-filter: blur(5px); border-radius: 14px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 12px; z-index: 10; border: 1px solid #ff3333; padding: 0 12px; white-space: nowrap; color: #fff; font-weight: bold; }
        .delete-badge:hover { transform: scale(1.08); background: rgba(255,0,0,1); box-shadow: 0 2px 8px rgba(255,51,51,0.4); }

        /* 弹窗样式 (复用 creator.html) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: rgba(20, 25, 40, 0.95); width: 600px; border-radius: 15px; padding: 30px; border: 1px solid #00e5ff; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,229,255,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px; }
        .modal-title { font-size: 20px; font-weight: bold; color: #00e5ff; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 28px; cursor: pointer; transition: 0.3s; line-height: 1; }
        .close-btn:hover { color: #fff; }
        .form-input { width:100%; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:12px; border-radius:8px; outline:none; font-size:14px; }
        .btn-primary { background:linear-gradient(90deg, #00b4db, #0083b0); color:#fff; width:100%; height:50px; font-size:16px; font-weight:bold; border:none; border-radius:8px; cursor:pointer; margin-top:20px; transition: 0.3s; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div style="display:flex; align-items:center; justify-content:center; gap:12px;">
            <img src="images/icon.png" alt="logo" style="width:38px; height:38px; border-radius:10px; object-fit:cover; box-shadow: 0 0 10px rgba(255,102,0,0.3);">
            <h2 style="margin:0; font-size:26px; letter-spacing:1px; color:#fff;">古建奇案馆</h2>
        </div>
    </div>
    <div class="menu-list">
        <button class="menu-item" onclick="goToPage('index.html')"><span>🏠</span><span>返回大厅</span></button>
        <button class="menu-item active" onclick="goToPage('my-creation.html')"><span>📚</span><span>我的创作</span></button>
    </div>
    <button class="btn-create-new" onclick="goToPage('creator.html')">+ 创作新剧本</button>
</div>

<div class="main-content">

    <div class="section-title" style="color: #00e5ff; border-color: rgba(0,229,255,0.2);">🌍 我管理的系列</div>
    <div class="grid-container" id="mySeriesGrid">
        <div style="color:#888; text-align:center; padding-top:20px; grid-column:1/-1;">正在加载系列数据...</div>
    </div>

    <div class="section-title">📝 我发布的单本</div>
    <div class="grid-container" id="myScriptGrid">
        <div style="color:#888; text-align:center; padding-top:20px; grid-column:1/-1;">正在加载剧本数据...</div>
    </div>

</div>

<div class="modal-overlay" id="seriesModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">✏️ 编辑 RPG 系列</div>
            <button class="close-btn" onclick="closeSeriesModal()">×</button>
        </div>
        <div style="display:flex; gap:20px; margin-bottom: 20px;">
            <div onclick="document.getElementById('seriesCoverInput').click()" style="cursor:pointer; text-align:center; flex-shrink:0;">
                <div style="width:100px; height:135px; background:rgba(0,0,0,0.3); border:2px dashed #00e5ff; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-direction: column; gap:5px;">
                    <span id="seriesUploadHint" style="color:#00e5ff; font-size:13px; display:none;">📸<br>系列海报</span>
                    <img id="seriesCoverPreview" style="width:100px; height:135px; border-radius:10px; object-fit:cover;">
                </div>
                <input type="file" id="seriesCoverInput" hidden accept="image/*" onchange="handleSeriesCover(this)">
            </div>

            <div style="flex:1; display:flex; flex-direction:column; gap:15px;">
                <div>
                    <input type="text" id="editSeriesName" class="form-input" placeholder="系列名称">
                </div>
                <div>
                    <textarea id="editSeriesDesc" class="form-input" style="height:50px;" placeholder="系列背景简介..."></textarea>
                </div>
                <div onclick="document.getElementById('seriesBgInput').click()" style="cursor:pointer; text-align:center; height: 60px;">
                    <div style="width:100%; height:100%; background:rgba(0,0,0,0.3); border:2px dashed #ff9900; border-radius:10px; display:flex; align-items:center; justify-content:center; position: relative; overflow: hidden;">
                        <span id="seriesBgHint" style="color:#fff; font-size:13px; z-index: 2; text-shadow: 0 0 3px #000;">🗺️ 背景已上传 (点击可更换)</span>
                        <img id="seriesBgPreview" style="position: absolute; width:100%; height:100%; object-fit:cover; opacity: 0.6;">
                    </div>
                    <input type="file" id="seriesBgInput" hidden accept="image/*" onchange="handleSeriesBg(this)">
                </div>
            </div>
        </div>
        <button class="btn-primary" onclick="submitEditSeries()" id="submitSeriesBtn">保存修改</button>
    </div>
</div>

<script>
    const API_BASE = '/api/game';
    let currentEditSeriesId = null;
    let editSeriesCoverUrl = "";
    let editSeriesBgUrl = "";

    function goToPage(url) { window.location.href = url; }

    window.onload = async function() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlUsername = urlParams.get('username');
        const localStorageUsername = localStorage.getItem('loginUsername');
        const username = urlUsername || localStorageUsername;
        
        if (!username) { alert("请先登录！"); window.location.href = 'login.html'; return; }

        loadMySeries();
        loadMyScripts(username);
    }

    // ================== 加载数据 ==================

    async function loadMySeries() {
        try {
            const res = await fetch(`${API_BASE}/series/list`).then(r => r.json());
            const grid = document.getElementById('mySeriesGrid');
            if (res.success && res.data && res.data.length > 0) {
                // 注意：这里假设全部系列都显示。如果您后端有按用户过滤系列的接口更好，没有的话这里先展示所有。
                let html = '';
                res.data.forEach(s => {
                    const bgUrl = s.backgroundUrl || 'https://images.unsplash.com/photo-1599059021750-82716ae2b661?q=80&w=600&auto=format&fit=crop';
                    html += `
                        <div class="series-card">
                            <div class="series-bg" style="background-image: url('${bgUrl}')"></div>
                            <div class="series-content">
                                <div class="series-name">${s.seriesName}</div>
                                <div class="series-desc">${s.seriesDesc || '暂无简介'}</div>
                            </div>
                            <button class="btn-edit-series" onclick="openEditSeriesModal(${s.seriesId})">✎ 编辑系列设定</button>
                            <button class="btn-delete-series" onclick="deleteSeries(${s.seriesId}, '${s.seriesName}')">🗑️ 删除系列</button>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            } else {
                grid.innerHTML = '<div style="color:#888; text-align:center; grid-column:1/-1;">您还没有创建任何系列。可以在创作新剧本时点击新建。</div>';
            }
        } catch (e) { console.error(e); }
    }

    async function loadMyScripts(username) {
        try {
            const res = await fetch(`/api/user/records/creation?username=${encodeURIComponent(username)}`).then(r => r.json());
            const grid = document.getElementById('myScriptGrid');

            if (res.success && res.data && res.data.length > 0) {
                let html = '';
                res.data.forEach(s => {
                    const actualId = parseInt(s.scriptId || s.script_id || s.id);
                    const title = s.title || s.script_name || '未命名';
                    const coverUrl = s.coverUrl || s.cover_url || 'https://placehold.co/90x120/1e2638/00e5ff?text=封面';

                    html += `
                    <div class="script-card">
                        <div class="edit-badge" onclick="goToPage('creator.html?scriptId=${actualId}')">✎ 编辑</div>
                        <div class="delete-badge" onclick="deleteScript(${actualId}, '${title}')">🗑️ 删除</div>
                        <div class="card-top">
                            <div class="card-cover" style="background: url('${coverUrl}') center/cover, #444;"></div>
                            <div class="card-info">
                                <div class="c-title" title="${title}">${title}</div>
                                <div class="c-tags"><span class="c-tag">${s.difficulty || '未知难度'}</span> <span class="c-tag">${s.playerCount || (s.config ? s.config.replace('人局', '人') : s.player_count) || '未知'}人本</span></div>
                            </div>
                        </div>
                        <div class="card-desc">${s.intro || s.script_desc || '暂无简介'}</div>
                        <button class="btn-edit-script" onclick="goToPage('creator.html?scriptId=${actualId}')">✎ 编辑剧本内容</button>
                    </div>`;
                });
                grid.innerHTML = html;
            } else {
                grid.innerHTML = '<div style="color:#888; text-align:center; grid-column:1/-1;">您还没有发布过剧本，快去创作吧！</div>';
            }
        } catch (e) { console.error(e); }
    }

    // ================== 删除系列逻辑 ==================

    async function deleteSeries(seriesId, seriesName) {
        if (!confirm(`确定要删除系列「${seriesName}」吗？此操作不可撤销！`)) {
            return;
        }

        try {
            const res = await fetch(`/api/game/series/${seriesId}`, {
                method: 'DELETE'
            }).then(r => r.json());

            if (res.success) {
                alert("🎉 系列删除成功！");
                loadMySeries();
            } else {
                alert("删除失败：" + res.msg);
            }
        } catch (e) {
            console.error(e);
            alert("网络异常，删除失败");
        }
    }

    // ================== 删除剧本逻辑 ==================

    async function deleteScript(scriptId, scriptTitle) {
        const urlParams = new URLSearchParams(window.location.search);
        const urlUsername = urlParams.get('username');
        const localStorageUsername = localStorage.getItem('loginUsername');
        const username = urlUsername || localStorageUsername;
        
        if (!username) {
            alert("请先登录！");
            window.location.href = 'login.html';
            return;
        }

        if (!confirm(`确定要删除剧本「${scriptTitle}」吗？此操作不可撤销！`)) {
            return;
        }

        try {
            const res = await fetch(`/api/game/script/${scriptId}?username=${encodeURIComponent(username)}`, {
                method: 'DELETE'
            }).then(r => r.json());

            if (res.success) {
                alert("🎉 剧本删除成功！");
                loadMyScripts(username);
            } else {
                alert("删除失败：" + res.msg);
            }
        } catch (e) {
            console.error(e);
            alert("网络异常，删除失败");
        }
    }

    // ================== 编辑系列弹窗逻辑 ==================

    async function openEditSeriesModal(seriesId) {
        try {
            const res = await fetch(`${API_BASE}/series/detail?seriesId=${seriesId}`).then(r => r.json());
            if (res.success && res.data) {
                const s = res.data;
                currentEditSeriesId = s.seriesId;

                document.getElementById('editSeriesName').value = s.seriesName || '';
                document.getElementById('editSeriesDesc').value = s.seriesDesc || '';

                editSeriesCoverUrl = s.coverUrl || '';
                if (editSeriesCoverUrl) {
                    document.getElementById('seriesCoverPreview').src = editSeriesCoverUrl;
                    document.getElementById('seriesCoverPreview').style.display = 'block';
                    document.getElementById('seriesUploadHint').style.display = 'none';
                }

                editSeriesBgUrl = s.backgroundUrl || '';
                const bgHint = document.getElementById('seriesBgHint');
                if (editSeriesBgUrl) {
                    document.getElementById('seriesBgPreview').src = editSeriesBgUrl;
                    document.getElementById('seriesBgPreview').style.display = 'block';
                    bgHint.style.color = '#fff';
                    bgHint.innerText = '🗺️ 背景已上传 (点击可更换)';
                } else {
                    document.getElementById('seriesBgPreview').style.display = 'none';
                    bgHint.innerText = '🗺️ 点击上传专属大地图背景 (横图最佳)';
                    bgHint.style.color = '#ff9900';
                }

                document.getElementById('seriesModal').style.display = 'flex';
            } else { alert("获取系列详情失败：" + res.msg); }
        } catch (e) { alert("网络异常，无法获取详情"); }
    }

    function closeSeriesModal() { document.getElementById('seriesModal').style.display = 'none'; }

    async function handleSeriesCover(input) {
        if(input.files[0]) {
            const formData = new FormData();
            formData.append("file", input.files[0]);
            const res = await fetch('/api/game/upload', { method: 'POST', body: formData }).then(r => r.json());
            if(res.success) {
                editSeriesCoverUrl = res.data;
                const img = document.getElementById('seriesCoverPreview');
                img.src = editSeriesCoverUrl;
                img.style.display = 'block';
                document.getElementById('seriesUploadHint').style.display = 'none';
            } else alert("上传失败：" + res.msg);
        }
    }

    async function handleSeriesBg(input) {
        if(input.files[0]) {
            const formData = new FormData();
            formData.append("file", input.files[0]);
            const res = await fetch('/api/game/upload', { method: 'POST', body: formData }).then(r => r.json());
            if(res.success) {
                editSeriesBgUrl = res.data;
                const img = document.getElementById('seriesBgPreview');
                img.src = editSeriesBgUrl;
                img.style.display = 'block';
                const bgHint = document.getElementById('seriesBgHint');
                bgHint.style.color = '#fff';
                bgHint.innerText = '🗺️ 背景上传成功 (点击可更换)';
            } else alert("上传失败：" + res.msg);
        }
    }

    async function submitEditSeries() {
        const name = document.getElementById('editSeriesName').value.trim();
        const desc = document.getElementById('editSeriesDesc').value.trim();
        if(!name) { alert("系列名称不能为空！"); return; }

        const btn = document.getElementById('submitSeriesBtn');
        btn.innerText = '保存中...'; btn.disabled = true;

        const payload = {
            seriesId: currentEditSeriesId,
            seriesName: name,
            seriesDesc: desc,
            coverUrl: editSeriesCoverUrl,
            backgroundUrl: editSeriesBgUrl
        };

        try {
            const res = await fetch('/api/game/series/update', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            }).then(r => r.json());

            if(res.success) {
                alert("🎉 系列修改成功！");
                closeSeriesModal();
                loadMySeries(); // 刷新系列列表
            } else { alert("修改失败：" + res.msg); }
        } catch(e) { alert("网络异常"); } finally {
            btn.innerText = '保存修改'; btn.disabled = false;
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧遇 - 编辑个人资料</title>
    <style>
        /* 全局样式重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif; }
        body { background-color: #0A192F; color: #FFFFFF; min-height: 100vh; }
        .container { display: flex; min-height: 100vh; }
        /* 左侧侧边栏样式 */
        .sidebar { width: 250px; background-color: #112240; padding: 30px 20px; flex-shrink: 0; display: flex; flex-direction: column; }
        .sidebar .logo { font-size: 32px; font-weight: bold; color: #FFFFFF; margin-bottom: 40px; text-align: center; position: relative; }
        .sidebar .logo::after { content: ""; display: block; width: 40px; height: 4px; background-color: #FF7F24; margin: 10px auto 0; border-radius: 2px; }
        .sidebar .menu-list { list-style: none; margin-top: 20px; }
        .sidebar .menu-item { padding: 12px 15px; border-radius: 8px; margin: 10px 0; cursor: pointer; transition: all 0.3s ease; font-size: 16px; }
        .sidebar .menu-item.active { background-color: #FF7F24; color: #FFFFFF; }
        .sidebar .menu-item:not(.active):hover { background-color: rgba(255, 127, 36, 0.2); }
        .sidebar .logout { margin-top: auto; padding: 12px 15px; border-radius: 8px; text-align: center; cursor: pointer; color: #CCCCCC; font-size: 14px; }
        .sidebar .logout:hover { color: #FF7F24; }
        /* 右侧主内容区 */
        .main-content { flex: 1; padding: 30px 40px; display: flex; flex-direction: column; }
        .user-header { display: flex; align-items: center; margin-bottom: 30px; }
        .avatar-container { position: relative; cursor: pointer; }
        .user-avatar { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #FF7F24; object-fit: cover; background-color: #112240; }
        #avatar-upload { display: none; }
        .user-info { margin-left: 20px; }
        .username { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .user-uid { color: #CCCCCC; font-size: 14px; }
        /* 表单卡片样式 */
        .profile-form-card { background-color: #FFFFFF; color: #0A192F; padding: 30px; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.3); max-width: 800px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group.full-width { grid-column: 1 / 3; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 500; color: #0A192F; }
        .form-control { width: 100%; padding: 12px 15px; border: 1px solid #DDDDDD; border-radius: 8px; font-size: 16px; color: #0A192F; background-color: #F9F9F9; }
        .form-control:focus { outline: none; border-color: #FF7F24; box-shadow: 0 0 5px rgba(255, 127, 36, 0.3); }
        .level-container { display: flex; align-items: center; gap: 10px; }
        .level-text { font-weight: bold; color: #0A192F; }
        .progress-bar-container { flex: 1; height: 10px; background-color: #EEEEEE; border-radius: 5px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: #FF7F24; border-radius: 5px; width: 70%; transition: width 0.3s ease; }
        textarea.form-control { resize: vertical; min-height: 100px; }
        .btn-group { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; }
        .btn { padding: 12px 25px; border-radius: 8px; border: none; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; }
        .btn-save { background-color: #112240; color: #FFFFFF; }
        .btn-save:hover { background-color: #172a4f; }
        .btn-cancel { background-color: #FF7F24; color: #FFFFFF; }
        .btn-cancel:hover { background-color: #e6701e; }
        .message { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; color: #FFFFFF; font-size: 16px; z-index: 9999; display: none; }
        .message.success { background-color: #28a745; }
        .message.error { background-color: #dc3545; }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; padding: 20px; }
            .sidebar .menu-list { display: flex; overflow-x: auto; gap: 10px; margin-top: 10px; }
            .main-content { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">剧遇</div>
        <ul class="menu-list">
            <li class="menu-item active">个人信息</li>
            <li class="menu-item" onclick="window.location.href='index.html'">首页</li>
            <li class="menu-item" onclick="window.location.href='profile.html'">个人中心</li>
        </ul>
        <div class="logout" onclick="window.location.href='login.html'">退出登录</div>
    </aside>

    <main class="main-content">
        <div class="user-header">
            <div class="avatar-container">
                <img src="https://placehold.co/80/112240/FFFFFF?text=头像" alt="用户头像" class="user-avatar" id="avatar-img">
                <input type="file" id="avatar-upload" accept="image/*">
            </div>
            <div class="user-info">
                <div class="username" id="username">加载中...</div>
                <div class="user-uid">User UID: <span id="user-uid">----</span></div>
            </div>
        </div>

        <div class="profile-form-card">
            <form id="profile-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="nickname">昵称</label>
                        <input type="text" class="form-control" id="nickname" name="nickname" placeholder="请输入昵称">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="realname">姓名</label>
                        <input type="text" class="form-control" id="realname" name="realname" placeholder="请输入真实姓名">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="gender">性别</label>
                        <input type="text" class="form-control" id="gender" name="gender" placeholder="男/女/保密">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="hobby-type">爱好类型</label>
                        <select class="form-control" id="hobby-type" name="hobbyType">
                            <option value="">请选择爱好类型</option>
                            <option value="推理">推理</option>
                            <option value="情感">情感</option>
                            <option value="恐怖">恐怖</option>
                            <option value="欢乐">欢乐</option>
                            <option value="机制">机制</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="birthday">生日</label>
                        <input type="date" class="form-control" id="birthday" name="birthday">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="city">城市</label>
                        <input type="text" class="form-control" id="city" name="city" placeholder="请输入所在城市">
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label">等级</label>
                        <div class="level-container">
                            <span class="level-text" id="level">Lv.1</span>
                            <div class="progress-bar-container">
                                <div class="progress-bar" id="level-progress"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label" for="intro">个人简介</label>
                        <textarea class="form-control" id="intro" name="intro" placeholder="请输入个人简介（关于剧本杀的爱好、擅长类型等）"></textarea>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn btn-cancel" id="cancel-btn">取消返回</button>
                    <button type="submit" class="btn btn-save" id="save-btn">保存修改</button>
                </div>
            </form>
        </div>
    </main>
</div>

<div class="message" id="message-box"></div>

<script>
    let avatarFile = null;

    const avatarImg = document.getElementById('avatar-img');
    const avatarUpload = document.getElementById('avatar-upload');
    const profileForm = document.getElementById('profile-form');
    const messageBox = document.getElementById('message-box');
    const cancelBtn = document.getElementById('cancel-btn');
    const levelProgress = document.getElementById('level-progress');

    document.addEventListener('DOMContentLoaded', () => {
        fetchUserProfile();

        avatarImg.addEventListener('click', () => { avatarUpload.click(); });
        avatarUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                avatarFile = file;
                const reader = new FileReader();
                reader.onload = (event) => { avatarImg.src = event.target.result; };
                reader.readAsDataURL(file);
            }
        });

        profileForm.addEventListener('submit', (e) => {
            e.preventDefault();
            saveUserProfile();
        });

        cancelBtn.addEventListener('click', () => {
            const username = localStorage.getItem('loginUsername') || '';
            window.location.href = `profile.html?username=${encodeURIComponent(username)}`;
        });
    });

    /**
     * 核心修复 1：使用 localStorage 动态获取真实账号，丢弃 URL 参数和写死的 cj06716
     */
    function fetchUserProfile() {
        const username = localStorage.getItem('loginUsername');
        if (!username) {
            alert("登录状态异常，请重新登录！");
            window.location.href = "login.html";
            return;
        }

        fetch(`/api/user/profile?username=${encodeURIComponent(username)}`)
            .then(response => response.json())
            .then(result => {
                if (result.success && result.data) {
                    const user = result.data;
                    document.getElementById('nickname').value = user.nickname || '';
                    document.getElementById('realname').value = user.realName || '';
                    document.getElementById('gender').value = user.gender === 1 ? '男' : (user.gender === 0 ? '女' : '');
                    document.getElementById('hobby-type').value = user.hobbyType || '';
                    document.getElementById('birthday').value = user.birthday ? user.birthday.toString().substring(0, 10) : '';
                    document.getElementById('city').value = user.city || '';
                    document.getElementById('intro').value = user.profile || '';
                    document.getElementById('username').textContent = user.username || username;
                    document.getElementById('user-uid').textContent = user.uid || '----';
                    document.getElementById('level').textContent = `Lv.${user.userLevel || 1}`;

                    if (user.avatarUrl) {
                        avatarImg.src = user.avatarUrl;
                    }
                } else {
                    showMessage(result.msg || '获取用户信息失败', 'error');
                }
            })
            .catch(error => {
                showMessage("获取用户信息异常", 'error');
            });
    }

    /**
     * 核心修复 2：防止传 "null" 字符串给后端导致 500 崩溃
     */
    function saveUserProfile() {
        const username = localStorage.getItem('loginUsername');
        if (!username) {
            alert("请先登录！");
            return;
        }

        const formData = new FormData();

        // 必传参数
        formData.append('username', username);

        // 选传参数：有值才 append，彻底避免出现 "null" 字符串
        const nickname = document.getElementById('nickname').value.trim();
        if (nickname) formData.append('nickname', nickname);

        const realname = document.getElementById('realname').value.trim();
        if (realname) formData.append('realName', realname);

        const genderStr = document.getElementById('gender').value.trim();
        if (genderStr === '男') formData.append('gender', 1);
        else if (genderStr === '女') formData.append('gender', 0);

        const hobbyType = document.getElementById('hobby-type').value;
        if (hobbyType) formData.append('hobbyType', hobbyType);

        const birthday = document.getElementById('birthday').value;
        if (birthday) formData.append('birthday', birthday);

        const city = document.getElementById('city').value.trim();
        if (city) formData.append('city', city);

        const intro = document.getElementById('intro').value.trim();
        if (intro) formData.append('profile', intro);

        if (avatarFile) {
            formData.append('avatar', avatarFile);
        }

        fetch('/api/user/profile', {
            method: 'POST',
            body: formData
        })
            .then(response => {
                if(!response.ok) throw new Error("服务器无响应 (500)");
                return response.json();
            })
            .then(result => {
                if (result.success) {
                    showMessage('资料保存成功！', 'success');
                    avatarFile = null;
                } else {
                    showMessage(result.msg || '保存资料失败', 'error');
                }
            })
            .catch(error => {
                showMessage(error.message, 'error');
            });
    }

    function showMessage(text, type) {
        messageBox.textContent = text;
        messageBox.className = `message ${type}`;
        messageBox.style.display = 'block';
        setTimeout(() => { messageBox.style.display = 'none'; }, 3000);
    }
</script>
</body>
</html>

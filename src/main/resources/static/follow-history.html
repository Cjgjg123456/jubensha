<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧遇 - 历史关注</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: url("images/4.jpg") no-repeat center center;
            background-size: cover;
            display: flex;
            padding: 20px;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            height: 100%;
            background: linear-gradient(180deg, rgba(15, 26, 58, 0.9), rgba(26, 42, 90, 0.9));
            border-radius: 20px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }
        .menu-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .menu-item {
            width: 100%;
            height: 60px;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.3s;
        }
        .menu-item:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.05);
        }

        .main-content {
            flex: 1;
            height: 100%;
            background: rgba(18, 22, 33, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            margin-left: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 0;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
            flex-shrink: 0;
        }
        .page-title {
            font-size: 28px;
            color: #fff;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
            transition: 0.3s;
            font-size: 14px;
        }
        .back-btn:hover {
            background: #ff6600;
            border-color: #ff6600;
        }

        /* 内容区域 - 纵向滚动 */
        #contentArea {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 6px;
        }
        #contentArea::-webkit-scrollbar {
            width: 6px;
        }
        #contentArea::-webkit-scrollbar-track {
            background: transparent;
        }
        #contentArea::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        /* ========== 横向滚动关注列表 ========== */
        .follow-list {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 16px;
            padding-bottom: 14px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
            -webkit-overflow-scrolling: touch;
        }
        .follow-list::-webkit-scrollbar {
            height: 6px;
        }
        .follow-list::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 3px;
        }
        .follow-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
            transition: background 0.3s;
        }
        .follow-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* 用户卡片 - 横向排列 */
        .user-card {
            flex: 0 0 280px;
            width: 280px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
            user-select: none;
        }
        .user-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 102, 0, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        .u-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #555;
            flex-shrink: 0;
        }
        .u-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .u-name {
            font-size: 18px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .u-bio {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-follow {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .btn-follow:hover {
            background: rgba(255, 102, 0, 0.2);
            border-color: #ff6600;
            color: #ff9900;
        }
        .btn-follow.mutual {
            border-color: #28a745;
            color: #28a745;
            background: rgba(40, 167, 69, 0.08);
        }
        .btn-follow.mutual:hover {
            background: rgba(40, 167, 69, 0.2);
            border-color: #2ecc71;
            color: #2ecc71;
        }

        /* ========== 脚本网格（横向滚动） ========== */
        .script-grid {
            display: flex;
            flex-wrap: nowrap;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 15px;
            scrollbar-width: auto;
            scrollbar-color: #ff6600 #2a2a2a;
            -webkit-overflow-scrolling: touch;
        }
        .script-grid::-webkit-scrollbar {
            height: 12px;
        }
        .script-grid::-webkit-scrollbar-track {
            background: #2a2a2a;
            border-radius: 6px;
        }
        .script-grid::-webkit-scrollbar-thumb {
            background: #ff6600;
            border-radius: 6px;
            min-width: 60px;
        }
        .script-grid::-webkit-scrollbar-thumb:hover {
            background: #ff8800;
        }
        .script-card {
            flex-shrink: 0;
            width: 320px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 15px;
            transition: 0.3s;
        }
        .script-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 102, 0, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }
        .card-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .card-cover {
            width: 60px;
            height: 80px;
            border-radius: 6px;
            background: #333;
            flex-shrink: 0;
        }
        .card-info {
            flex: 1;
            min-width: 0;
        }
        .card-title {
            font-size: 16px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .card-tag {
            background: rgba(255, 255, 255, 0.1);
            color: #bbb;
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .card-desc {
            font-size: 13px;
            color: #999;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .card-actions {
            display: flex;
            gap: 8px;
        }
        .card-btn {
            flex: 1;
            padding: 6px 0;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }
        .card-btn.eval {
            background: #2a2d3e;
            border: 1px solid #4a4d5e;
            color: #ccc;
        }
        .card-btn.eval:hover {
            background: #3a3d4e;
            border-color: #6a6d7e;
        }
        .card-btn.room {
            background: linear-gradient(90deg, #ff6600, #ff3300);
            border: none;
            color: #fff;
        }
        .card-btn.room:hover {
            background: linear-gradient(90deg, #ff7700, #ff4400);
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.3);
        }
        .empty-hint {
            color: #888;
            text-align: center;
            padding: 50px 0;
            font-size: 15px;
        }

        .back-link {
            color: #ff6600;
            cursor: pointer;
            margin-top: 15px;
            display: inline-block;
            font-size: 14px;
            transition: 0.3s;
        }
        .back-link:hover {
            text-decoration: underline;
            color: #ff8800;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:50px;">
            <img src="images/icon.png" alt="logo"
            style="width:38px; height:38px; border-radius:10px; object-fit:cover;"
            onerror="this.style.display='none';">
            <h2 style="margin:0; font-size:22px; letter-spacing:1px; color:#fff;">古建奇案馆</h2>
        </div>
        <div class="menu-list">
            <button class="menu-item" onclick="goToProfile()"><span>👤</span><span>个人信息</span></button>
        </div>
    </div>

    <div class="main-content">
        <div class="header-top">
            <h1 class="page-title" id="pageTitle">📍 历史关注</h1>
            <button class="back-btn" onclick="goToProfile()">← 返回个人中心</button>
        </div>

        <div id="contentArea">
            <div class="follow-list" id="userList"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/game';
        let myFavorites = [];

        function goToProfile() {
            const username = localStorage.getItem('loginUsername') || '';
            window.location.href = `profile.html?username=${encodeURIComponent(username)}`;
        }

        function goToPage(page) {
            window.location.href = page;
        }

        // 展示某用户的作品（脚本网格）
        async function showUserScripts(userId, userName) {
            document.getElementById('pageTitle').textContent = `📖 ${userName} 的作品`;
            const content = document.getElementById('contentArea');

            try {
                const res = await fetch(`${API_BASE}/scripts/by-user/${userId}`).then(r => r.json());
                if (res.success && res.data.length > 0) {
                    let html =
                        `<div class="back-link" onclick="loadFollowUsers()">← 返回关注列表</div><div class="script-grid">`;
                    res.data.forEach(s => {
                        const id = s.scriptId || s.script_id || s.id;
                        const title = s.title || s.script_name || '未命名';
                        const cover = s.coverUrl || s.cover_url || '';
                        const creator = s.creatorName || '暗区兵王';
                        html += `
                        <div class="script-card">
                            <div class="card-header">
                                <div class="card-cover" style="background: url('${cover}') center/cover, #444;"></div>
                                <div class="card-info">
                                    <div class="card-title" title="${title}">${title}</div>
                                    <div class="card-tags"><span class="card-tag">${creator}</span></div>
                                </div>
                            </div>
                            <div class="card-desc">${s.intro || s.script_desc || '暂无简介'}</div>
                            <div class="card-actions">
                                <button class="card-btn eval" onclick="alert('评价功能开发中~')">⭐ 评价</button>
                                <button class="card-btn room" onclick="goToPage('room.html')">🎲 创建房间</button>
                            </div>
                        </div>`;
                    });
                    html += '</div>';
                    content.innerHTML = html;
                    content.scrollTop = 0;
                } else {
                    content.innerHTML =
                        `<div class="back-link" onclick="loadFollowUsers()">← 返回关注列表</div><div class="empty-hint">该作者还没有发布作品~</div>`;
                }
            } catch (e) {
                content.innerHTML =
                    `<div class="back-link" onclick="loadFollowUsers()">← 返回关注列表</div><div class="empty-hint" style="color:red;">网络异常，请稍后重试</div>`;
            }
        }

        // 加载关注用户列表（横向排列）
        function loadFollowUsers() {
            document.getElementById('pageTitle').textContent = '📍 历史关注';
            const content = document.getElementById('contentArea');
            const username = localStorage.getItem('loginUsername');

            // 显示加载状态
            content.innerHTML =
                '<div class="empty-hint" style="color:#aaa;">加载中<span class="loading-dots"></span></div>';

            fetch(`/api/user/records/follow?username=${encodeURIComponent(username)}`)
                .then(r => r.json())
                .then(res => {
                    if (res.success && res.data.length > 0) {
                        let html = '<div class="follow-list">';
                        res.data.forEach(item => {
                            const nickname = (item.nickname || item.username || '未知用户').replace(/'/g,
                                "\\'");
                            const avatar = item.avatar_url || 'images/default-avatar.png';
                            const bio = item.profile || '点击查看该创作者的全部作品';
                            html += `
                            <div class="user-card"
                                 onclick="showUserScripts(${item.followed_user_id}, '${nickname}')"
                                 title="查看 ${nickname} 的作品">
                                <img src="${avatar}"
                                     class="u-avatar"
                                     onerror="this.src='images/default-avatar.png'"
                                     alt="${nickname}">
                                <div class="u-info">
                                    <div class="u-name">${nickname}</div>
                                    <div class="u-bio">${bio}</div>
                                </div>
                                <button class="btn-follow mutual"
                                        onclick="event.stopPropagation(); toggleFollow(${item.followed_user_id});"
                                        title="取消关注">
                                    已关注
                                </button>
                            </div>`;
                        });
                        html += '</div>';
                        content.innerHTML = html;
                        content.scrollTop = 0;
                    } else {
                        content.innerHTML = '<div class="empty-hint">您还没有关注任何人哦~<br><span style="font-size:13px;color:#aaa;">去发现更多创作者吧</span></div>';
                    }
                })
                .catch(() => {
                    content.innerHTML = '<div class="empty-hint" style="color:red;">网络异常，请稍后重试</div>';
                });
        }

        // 切换关注状态
        async function toggleFollow(followedUserId) {
            const username = localStorage.getItem('loginUsername');
            if (!username) return;
            try {
                await fetch(`/api/user/follow`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, followedUserId: followedUserId })
                }).then(r => r.json());
                loadFollowUsers();
            } catch (e) {
                // 静默失败，重新加载列表
                loadFollowUsers();
            }
        }

        // 页面加载时获取关注列表
        window.onload = loadFollowUsers;

        // 简单的加载动画
        const styleEl = document.createElement('style');
        styleEl.textContent = `
            .loading-dots::after {
                content: '';
                animation: dots 1.5s steps(3, end) infinite;
            }
            @keyframes dots {
                0% { content: ''; }
                33% { content: '.'; }
                66% { content: '..'; }
                100% { content: '...'; }
            }
        `;
        document.head.appendChild(styleEl);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古建奇案馆 - 快速匹配</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif; }
        body { width: 100vw; height: 100vh; background: url("images/4.jpg") no-repeat center center; background-size: cover; display: flex; padding: 20px; overflow: hidden; }

        /* ================= 侧边栏 ================= */
        .sidebar { width: 280px; height: 100%; background: linear-gradient(180deg, rgba(15,26,58,0.9), rgba(26,42,90,0.9)); border-radius: 20px; padding: 40px 20px; display: flex; flex-direction: column; position: relative; backdrop-filter: blur(10px); }
        .sidebar-logo { text-align: center; margin-bottom: 50px; }
        .sidebar-logo h2 { color: #fff; font-size: 42px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .sidebar-logo .star { width: 25px; height: 35px; background: #ff6600; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .menu-list { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .menu-item { width: 100%; height: 60px; background: transparent; border: none; border-radius: 12px; color: #fff; font-size: 18px; display: flex; align-items: center; padding: 0 20px; gap: 15px; cursor: pointer; transition: all 0.3s; opacity: 0.7; }
        .menu-item:hover { opacity: 1; background: rgba(255,255,255,0.1); }
        .logout-btn { width: 100%; height: 50px; background: transparent; border: none; color: #fff; font-size: 16px; cursor: pointer; transition: all 0.3s; text-align: left; padding-left: 20px; opacity: 0.7; }
        .logout-btn:hover { opacity: 1; color: #ff3300; }

        /* ================= 主内容区 ================= */
        .main-content { flex: 1; height: 100%; background: rgba(20, 25, 40, 0.85); backdrop-filter: blur(15px); border-radius: 20px; margin-left: 20px; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .back-btn { position: absolute; top: 30px; left: 40px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; color: #fff; transition: 0.3s; }
        .back-btn:hover { background: #ff6600; border-color: #ff6600; }

        /* 匹配条件偏好设置 */
        .preferences { display: flex; gap: 20px; background: rgba(0,0,0,0.3); padding: 20px 40px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .pref-item select { padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); outline: none; font-size: 15px; background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; }
        .pref-item select option { background: #1a2a5a; color: #fff; }

        /* 房间搜索区域 */
        .room-search-area { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .room-search-input { padding: 12px 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); outline: none; font-size: 15px; background: rgba(255,255,255,0.1); color: #fff; width: 250px; }
        .room-search-input::placeholder { color: #888; }
        .search-btn { padding: 12px 25px; border-radius: 8px; border: none; background: linear-gradient(135deg, #00a8ff, #0066cc); color: #fff; font-size: 15px; cursor: pointer; transition: 0.3s; }
        .search-btn:hover { box-shadow: 0 0 15px rgba(0,168,255,0.5); }

        /* 房间列表 */
        .room-list { display: none; flex-direction: column; gap: 15px; width: 100%; max-width: 600px; }
        .room-card { background: rgba(30, 38, 56, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .room-card:hover { border-color: #ff6600; }
        .room-info { flex: 1; }
        .room-name { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .room-detail { font-size: 14px; color: #aaa; }
        .room-status { padding: 5px 12px; border-radius: 20px; font-size: 12px; }
        .status-idle { background: rgba(40,167,69,0.2); color: #28a745; }
        .status-playing { background: rgba(255,102,0,0.2); color: #ff6600; }
        .join-room-btn { padding: 10px 20px; border-radius: 8px; border: none; background: linear-gradient(135deg, #ff6600, #ff3300); color: #fff; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .join-room-btn:hover { box-shadow: 0 0 15px rgba(255,102,0,0.5); }
        .no-rooms { text-align: center; color: #aaa; font-size: 16px; padding: 20px; }

        /* 匹配等待区 UI */
        .match-waiting-area { display: flex; flex-direction: column; align-items: center; transition: opacity 0.3s; }
        .timer-display { font-size: 48px; font-weight: bold; color: #ff9900; margin-bottom: 20px; font-family: monospace; text-shadow: 0 0 15px rgba(255, 153, 0, 0.5); }
        .match-radar-container { position: relative; width: 250px; height: 250px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }
        .radar-btn { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #ff6600, #ff3300); color: #fff; font-size: 22px; font-weight: bold; border: none; cursor: pointer; position: relative; z-index: 10; box-shadow: 0 0 30px rgba(255, 102, 0, 0.6); transition: transform 0.2s; }
        .radar-btn:hover { transform: scale(1.05); }

        .ripple { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 2px solid #ff6600; z-index: 1; opacity: 0; }
        .ripple.active { animation: rippleAnim 2s infinite cubic-bezier(0.1, 0.5, 0.8, 1); }
        .ripple:nth-child(2) { animation-delay: 0.6s; }
        .ripple:nth-child(3) { animation-delay: 1.2s; }
        @keyframes rippleAnim { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3.5); opacity: 0; } }
        .status-text { font-size: 18px; color: #aaa; letter-spacing: 1px; text-align: center;}

        /* ================= 匹配成功结果卡片 ================= */
        .match-result-card { display: none; width: 600px; background: rgba(30, 38, 56, 0.95); border: 1px solid #445; border-radius: 20px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .result-header { text-align: center; margin-bottom: 20px; color: #28a745; font-size: 24px; font-weight: bold; text-shadow: 0 0 10px rgba(40,167,69,0.4); }
        .script-info { display: flex; gap: 20px; margin-bottom: 25px; }
        .script-cover { width: 140px; height: 190px; border-radius: 10px; background: #333; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .script-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .script-title { font-size: 26px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .tags { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag { background: rgba(255,102,0,0.2); color: #ff9900; padding: 4px 10px; border-radius: 6px; font-size: 13px; border: 1px solid rgba(255,102,0,0.3); }
        .info-row { font-size: 14px; color: #ccc; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .stars { color: #ffcc00; font-size: 14px; }
        .script-desc { font-size: 14px; color: #aaa; line-height: 1.6; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 25px; max-height: 100px; overflow-y: auto; }

        .action-btns { display: flex; gap: 20px; }
        .btn-join { flex: 1; padding: 15px; background: linear-gradient(90deg, #ff6600, #ff3300); border: none; border-radius: 10px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-join:hover { box-shadow: 0 0 20px rgba(255,102,0,0.5); transform: translateY(-2px); }
        .btn-rematch { flex: 1; padding: 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .btn-rematch:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div style="display:flex; align-items:center; justify-content:center; gap:12px;">
            <img src="images/icon.png" alt="logo" style="width:38px; height:38px; border-radius:10px; object-fit:cover; box-shadow: 0 0 10px rgba(255,102,0,0.3);">
            <h2 style="margin:0; font-size:26px; letter-spacing:1px; color:#fff;">古建奇案馆</h2>
        </div>
    </div>
    <div class="menu-list">
        <button class="menu-item" onclick="goToPage('index.html')"><span>🏠</span><span>首页</span></button>
        <button class="menu-item" onclick="goToPage('profile.html')"><span>👤</span><span>个人信息</span></button>
        <button class="menu-item" onclick="goToPage('chat.html')"><span>💬</span><span>好友私信</span></button>
    </div>
    <button class="logout-btn" id="logoutBtn">退出登录</button>
</div>

<div class="main-content">
    <button class="back-btn" onclick="goToPage('index.html')">← 返回首页</button>

    <div class="preferences" id="filterArea">
        <div class="pref-item">
            <select id="scriptType">
                <option value="all">题材 (不限)</option>
                <option value="推理">硬核推理</option>
                <option value="情感">沉浸情感</option>
                <option value="恐怖">微恐惊悚</option>
                <option value="欢乐">沙雕欢乐</option>
            </select>
        </div>
        <div class="pref-item">
            <select id="playerCount">
                <option value="all">人数 (不限)</option>
                <option value="5">5人本</option>
                <option value="6">6人本</option>
                <option value="7">7人本</option>
            </select>
        </div>
        <div class="pref-item">
            <select id="scriptDiff">
                <option value="all">难度 (不限)</option>
                <option value="1">新手 (1-2星)</option>
                <option value="3">进阶 (3-4星)</option>
                <option value="5">烧脑 (5星)</option>
            </select>
        </div>
    </div>

    <div class="room-search-area" id="roomSearchArea">
        <input type="text" class="room-search-input" id="roomIdInput" placeholder="输入房间号搜索">
        <button class="search-btn" onclick="searchRoom()">搜索房间</button>
    </div>

    <div class="room-list" id="roomList">
        <div class="no-rooms" id="noRooms">暂无公开房间</div>
    </div>

    <div class="match-waiting-area" id="waitingArea">
        <div class="timer-display" id="timer">00:00</div>
        <div class="match-radar-container">
            <div class="ripple" id="r1"></div>
            <div class="ripple" id="r2"></div>
            <div class="ripple" id="r3"></div>
            <button class="radar-btn" id="matchBtn">开始匹配</button>
        </div>
        <div class="status-text" id="statusText">选择上方条件<br>点击按钮即刻寻找默契车队</div>
    </div>

    <div class="match-result-card" id="resultCard">
        <div class="result-header">✨ 匹配成功，已为您锁定车队 ✨</div>
        <div class="script-info">
            <div class="script-cover" id="resCover" style="background-color: #444;"></div>
            <div class="script-details">
                <div>
                    <div class="script-title" id="resTitle">《加载中...》</div>
                    <div class="tags" id="resTags"></div>
                </div>
                <div>
                    <div class="info-row">👥 房间人数：<strong style="color:#fff;" id="resWait">加载中</strong></div>
                    <div class="info-row">🚻 角色配置：<span id="resConfig">加载中</span></div>
                    <div class="info-row">🔥 剧本难度：<span class="stars" id="resStars">★★★☆☆</span></div>
                </div>
            </div>
        </div>
        <div class="script-desc" id="resDesc">加载中...</div>
        <div class="action-btns">
            <button class="btn-rematch" onclick="rematch()">不感兴趣，重新匹配</button>
            <button class="btn-join" onclick="joinRoom()">确认加入房间</button>
        </div>
    </div>
</div>

<script>
    function goToPage(pageUrl) {
        const username = localStorage.getItem('loginUsername') || '';
        window.location.href = `${pageUrl}?username=${encodeURIComponent(username)}`;
    }

    let isMatching = false;
    let matchRequestId = 0;
    let matchAbortController = null;
    let resultCardHideTimeout = null;
    let timerInterval = null;
    let seconds = 0;
    let currentMatchedRoom = null;
    let isJoiningMatchedRoom = false;

    const matchBtn = document.getElementById('matchBtn');
    const ripples = document.querySelectorAll('.ripple');
    const statusText = document.getElementById('statusText');
    const timerDisplay = document.getElementById('timer');
    const waitingArea = document.getElementById('waitingArea');
    const resultCard = document.getElementById('resultCard');
    const filterArea = document.getElementById('filterArea');
    const roomSearchArea = document.getElementById('roomSearchArea');
    const roomIdInput = document.getElementById('roomIdInput');
    const roomList = document.getElementById('roomList');

    function formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimer() {
        seconds++;
        timerDisplay.innerText = formatTime(seconds);
    }

    function getLoginInfo() {
        const username = localStorage.getItem('loginUsername') || '';
        const userId = localStorage.getItem('userId') || '';
        const avatar = localStorage.getItem('avatarUrl') || '';
        if (!username || !userId || userId === 'undefined' || userId === 'null') {
            alert('登录状态已失效，请重新登录！');
            window.location.href = 'login.html';
            return null;
        }
        return { username, userId, avatar };
    }

    function clearResultCardHideTimer() {
        if (resultCardHideTimeout) {
            clearTimeout(resultCardHideTimeout);
            resultCardHideTimeout = null;
        }
    }

    async function releaseMatchedRoom() {
        if (!currentMatchedRoom || isJoiningMatchedRoom) return;
        const userId = localStorage.getItem('userId') || '';
        if (!userId || !currentMatchedRoom.roomId) return;
        try {
            const params = new URLSearchParams({ roomId: currentMatchedRoom.roomId, userId });
            await fetch('/api/online/room/leave', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });
        } catch (error) {
            console.warn('释放匹配房间失败:', error);
        }
    }

    function resetMatchButton() {
        matchBtn.innerText = '开始匹配';
        matchBtn.style.background = 'linear-gradient(135deg, #ff6600, #ff3300)';
        ripples.forEach(r => r.classList.remove('active'));
        filterArea.style.opacity = '1';
        filterArea.style.pointerEvents = 'auto';
    }

    async function hideMatchResult(options = {}) {
        const { releaseRoom = true, message = '' } = options;
        clearResultCardHideTimer();
        if (releaseRoom) {
            await releaseMatchedRoom();
        }
        currentMatchedRoom = null;
        isJoiningMatchedRoom = false;
        resultCard.style.display = 'none';
        waitingArea.style.display = 'flex';
        filterArea.style.display = 'flex';
        roomSearchArea.style.display = 'flex';
        resetMatchButton();
        statusText.innerHTML = message || '选择上方条件<br>点击按钮即刻寻找默契车队';
        statusText.style.color = '#aaa';
    }

    async function startMatching() {
        const login = getLoginInfo();
        if (!login) return;

        clearResultCardHideTimer();
        currentMatchedRoom = null;
        isJoiningMatchedRoom = false;
        resultCard.style.display = 'none';
        roomSearchArea.style.display = 'none';

        const requestId = ++matchRequestId;
        if (matchAbortController) {
            matchAbortController.abort();
        }
        matchAbortController = new AbortController();

        const selectedType = document.getElementById('scriptType').value;
        const selectedCount = document.getElementById('playerCount').value;
        const selectedDiff = document.getElementById('scriptDiff').value;

        isMatching = true;
        seconds = 0;
        timerDisplay.innerText = '00:00';
        matchBtn.innerText = '取消匹配';
        matchBtn.style.background = 'linear-gradient(135deg, #ff3333, #cc0000)';
        ripples.forEach(r => r.classList.add('active'));
        filterArea.style.opacity = '0.5';
        filterArea.style.pointerEvents = 'none';
        statusText.innerHTML = '正在寻找可加入的房间...';
        statusText.style.color = '#ff9900';
        timerInterval = setInterval(updateTimer, 1000);

        try {
            const params = new URLSearchParams({
                userId: login.userId,
                username: login.username,
                avatar: login.avatar,
                scriptType: selectedType,
                playerCount: selectedCount,
                scriptDiff: selectedDiff
            });
            const response = await fetch('/api/online/room/match', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params,
                signal: matchAbortController.signal
            });
            const result = await response.json();
            if (requestId !== matchRequestId || !isMatching) return;

            if (result.success && result.data) {
                showMatchResult(result.data);
            } else {
                stopMatching({ keepMessage: true });
                statusText.innerHTML = result.msg || '暂无可加入的房间，请先创建房间。';
                statusText.style.color = '#ff6666';
            }
        } catch (error) {
            if (error.name === 'AbortError') return;
            console.error('匹配失败:', error);
            if (requestId === matchRequestId) {
                stopMatching({ keepMessage: true });
                statusText.innerHTML = '网络异常，匹配失败，请稍后重试。';
                statusText.style.color = '#ff6666';
            }
        } finally {
            if (requestId === matchRequestId) {
                matchAbortController = null;
            }
        }
    }

    function stopMatching(options = {}) {
        isMatching = false;
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        if (matchAbortController) {
            matchAbortController.abort();
            matchAbortController = null;
        }
        resetMatchButton();
        if (!options.keepMessage) {
            statusText.innerHTML = '选择上方条件<br>点击按钮即刻寻找默契车队';
            statusText.style.color = '#aaa';
        }
        roomSearchArea.style.display = 'flex';
    }

    function splitTags(tags) {
        if (!tags) return [];
        return String(tags).split(/[，,、\s]+/).map(t => t.trim()).filter(Boolean).slice(0, 5);
    }

    function starsFromDifficulty(value) {
        const parsed = parseInt(String(value || '').replace(/[^0-9]/g, ''), 10);
        const count = Number.isFinite(parsed) && parsed > 0 ? Math.min(parsed, 5) : 3;
        return '★★★★★'.slice(0, count) + '☆☆☆☆☆'.slice(0, 5 - count);
    }

    function showMatchResult(room) {
        stopMatching({ keepMessage: true });
        currentMatchedRoom = room;

        const title = room.scriptTitle || room.roomName || '匹配房间';
        document.getElementById('resTitle').innerText = `《${title}》`;
        document.getElementById('resConfig').innerText = room.scriptPlayerCount ? `${room.scriptPlayerCount}人本` : `${room.maxPlayers || '?'}人房间`;
        document.getElementById('resStars').innerText = starsFromDifficulty(room.scriptDifficulty);
        document.getElementById('resDesc').innerText = room.scriptIntro || `房间：${room.roomName || room.roomId}`;
        document.getElementById('resWait').innerText = `${room.playerCount || 0}/${room.maxPlayers || '?'} (${room.roomName || room.roomId})`;

        const cover = document.getElementById('resCover');
        cover.style.background = room.scriptCoverUrl
            ? `url('${String(room.scriptCoverUrl).replace(/'/g, '')}') center/cover, #444`
            : '#444';

        const tagsBox = document.getElementById('resTags');
        tagsBox.innerHTML = '';
        const tags = splitTags(room.scriptTags);
        if (tags.length === 0) tags.push('等待中');
        tags.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = tag;
            tagsBox.appendChild(span);
        });

        waitingArea.style.display = 'none';
        filterArea.style.display = 'none';
        roomSearchArea.style.display = 'none';
        resultCard.style.display = 'block';

        // 匹配成功后一直显示，直到用户点击加入或重试
    }

    async function rematch() {
        await hideMatchResult({ releaseRoom: true });
        startMatching();
    }

    function joinRoom() {
        if (!currentMatchedRoom) {
            alert('匹配结果已过期，请重新匹配');
            return;
        }
        const login = getLoginInfo();
        if (!login) return;

        isJoiningMatchedRoom = true;
        clearResultCardHideTimer();
        const targetUrl = `game-room.html?username=${encodeURIComponent(login.username)}&roomId=${encodeURIComponent(currentMatchedRoom.roomId)}&roomName=${encodeURIComponent(currentMatchedRoom.roomName || '')}&scriptId=${encodeURIComponent(currentMatchedRoom.scriptId)}&mode=online`;
        window.location.href = targetUrl;
    }

    matchBtn.addEventListener('click', function() {
        if (!isMatching) { startMatching(); }
        else { stopMatching(); }
    });

    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.clear(); window.location.href = 'login.html';
    });

    async function searchRoom() {
        const roomId = roomIdInput.value.trim();
        if (!roomId) {
            alert('请输入房间号');
            return;
        }

        try {
            const response = await fetch(`/api/online/room/${encodeURIComponent(roomId)}`);
            const result = await response.json();
            if (result.code === 200 && result.data) {
                showRoomSearchResult([result.data]);
            } else {
                showRoomSearchResult([]);
            }
        } catch (error) {
            console.error('搜索房间失败:', error);
            showRoomSearchResult([]);
        }
    }

    async function loadPublicRooms() {
        try {
            const response = await fetch('/api/online/rooms');
            const result = await response.json();
            if (result.code === 200 && result.data) {
                showRoomSearchResult(result.data);
            } else {
                showRoomSearchResult([]);
            }
        } catch (error) {
            console.error('加载房间列表失败:', error);
            showRoomSearchResult([]);
        }
    }

    function showRoomSearchResult(rooms) {
        roomList.innerHTML = '';
        if (rooms.length === 0) {
            roomList.style.display = 'none';
            return;
        }

        roomList.style.display = 'flex';
        rooms.forEach(room => {
            const roomCard = document.createElement('div');
            roomCard.className = 'room-card';

            const roomInfo = document.createElement('div');
            roomInfo.className = 'room-info';
            const roomName = document.createElement('div');
            roomName.className = 'room-name';
            roomName.textContent = room.roomName;
            const roomDetail = document.createElement('div');
            roomDetail.className = 'room-detail';
            roomDetail.textContent = `房间号: ${room.roomId} | 人数: ${room.playerCount}/${room.maxPlayers}`;
            roomInfo.appendChild(roomName);
            roomInfo.appendChild(roomDetail);

            const actions = document.createElement('div');
            actions.style.display = 'flex';
            actions.style.alignItems = 'center';
            actions.style.gap = '15px';
            const status = document.createElement('span');
            status.className = `room-status ${room.status === 'IDLE' ? 'status-idle' : 'status-playing'}`;
            status.textContent = room.status === 'IDLE' ? '等待中' : '游戏中';
            const joinBtn = document.createElement('button');
            joinBtn.className = 'join-room-btn';
            joinBtn.textContent = '加入';
            joinBtn.onclick = () => joinRoomById(room.roomId, room.roomName, room.scriptId);
            actions.appendChild(status);
            actions.appendChild(joinBtn);

            roomCard.appendChild(roomInfo);
            roomCard.appendChild(actions);
            roomList.appendChild(roomCard);
        });
    }

    function joinRoomById(roomId, roomName, scriptId) {
        const login = getLoginInfo();
        if (!login) return;
        const targetUrl = `game-room.html?username=${encodeURIComponent(login.username)}&roomId=${encodeURIComponent(roomId)}&roomName=${encodeURIComponent(roomName)}&scriptId=${encodeURIComponent(scriptId)}&mode=online`;
        window.location.href = targetUrl;
    }

    window.addEventListener('beforeunload', () => {
        if (currentMatchedRoom && !isJoiningMatchedRoom && navigator.sendBeacon) {
            const params = new URLSearchParams({
                roomId: currentMatchedRoom.roomId,
                userId: localStorage.getItem('userId') || ''
            });
            navigator.sendBeacon('/api/online/room/leave', params);
        }
    });

    loadPublicRooms();
</script>
</body>
</html>

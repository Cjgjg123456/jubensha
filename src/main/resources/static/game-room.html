    window.openRoleModal = async function() {
        if (availableRoles.length === 0) {
            alert("该剧本尚未配置角色，无法开局！");
            return;
        }

        // ✅ 联机模式 / AI 沉浸模式：角色选择已内嵌在主界面，直接滚动到角色区即可
        if ((currentMode === 'online' && currentRoomId) || currentMode === 'ai') {
            const rolesSection = document.querySelector('.roles-section');
            if (rolesSection) {
                rolesSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
                rolesSection.style.borderColor = currentMode === 'ai' ? '#00e5ff' : '#d4b475';
                setTimeout(() => { rolesSection.style.borderColor = '#3a3a3a'; }, 1500);
            }
            return;
        }

        // ✅ 获取当前用户ID和已选择的角色列表
        const currentUserId = localStorage.getItem('userId');
        const currentUsername = localStorage.getItem('loginUsername') || '玩家';
        
        let selectedRoleIds = {};
        let roleTakenBy = {};
        let myCurrentRoleId = null;

        if (currentMode === 'online' && currentRoomId) {
            const roomRes = await fetch('/api/online/rooms').then(r => r.json());
            if (roomRes.success && roomRes.data) {
                const room = roomRes.data.find(r => r.roomId === currentRoomId);
                if (room) {
                    currentHostId = room.hostId;
                    
                    // ✅ 收集其他玩家已选择的角色ID及选择者
                    if (room.players && room.players.length > 0) {
                        room.players.forEach(p => {
                            if (p.roleId) {
                                if (String(p.userId) === String(currentUserId)) {
                                    myCurrentRoleId = p.roleId;
                                    window.selectedRoleId = p.roleId;
                                } else {
                                    selectedRoleIds[p.roleId] = true;
                                    roleTakenBy[p.roleId] = p.username;
                                }
                            }
                        });
                        console.log('[角色选择] 已被选择的角色:', selectedRoleIds);
                        console.log('[角色选择] 角色选择者:', roleTakenBy);
                    }
                    
                    // ✅ 只有房主可以触发AI填充
                    if (isCurrentUserHost() && room.playerCount < room.maxPlayers) {
                        if (!confirm(`当前房间只有 ${room.playerCount} 人，需要 ${room.maxPlayers} 人才能开始游戏。\n是否使用AI玩家补齐剩余位置？`)) {
                            return;
                        }

                        const fillRes = await fetch(`/api/online/room/${currentRoomId}/fill-with-ai`, {
                            method: 'POST'
                        }).then(r => r.json());

                        if (!fillRes.success) {
                            alert("AI填充失败：" + (fillRes.msg || "未知错误"));
                            return;
                        }
                        alert("✅ AI玩家已就位！");
                        
                        // 重新获取房间信息以更新角色列表
                        const updatedRoomRes = await fetch('/api/online/rooms').then(r => r.json());
                        if (updatedRoomRes.success && updatedRoomRes.data) {
                            const updatedRoom = updatedRoomRes.data.find(r => r.roomId === currentRoomId);
                            if (updatedRoom && updatedRoom.players) {
                                selectedRoleIds = {};
                                roleTakenBy = {};
                                myCurrentRoleId = null;
                                updatedRoom.players.forEach(p => {
                                    if (p.roleId) {
                                        if (String(p.userId) === String(currentUserId)) {
                                            myCurrentRoleId = p.roleId;
                                            window.selectedRoleId = p.roleId;
                                        } else {
                                            selectedRoleIds[p.roleId] = true;
                                            roleTakenBy[p.roleId] = p.username;
                                        }
                                    }
                                });
                            }
                        }
                    }
                }
            }
        }

        const listContainer = document.getElementById('roleListContainer');
        
        // ✅ 生成角色列表，包含所有角色（已选和可选）
        const rolesHtml = availableRoles.map(role => {
            const isUnavailable = selectedRoleIds[role.roleId];
            const isSelected = window.selectedRoleId === role.roleId;
            const takenBy = roleTakenBy[role.roleId];
            
            // ✅ 已选择的角色添加特殊样式
            let cardClass = 'role-card';
            if (isSelected) {
                cardClass += ' role-selected';
            } else if (isUnavailable) {
                cardClass += ' role-unavailable';
            }
            
            return `
                <div class="${cardClass}" 
                     data-role-id="${role.roleId}"
                     onclick="handleRoleClick(${role.roleId}, '${role.name}')"
                     ondblclick="handleRoleDoubleClick(${role.roleId})">
                    <img src="${getAvatarUrl(role.name, role.avatar)}" onerror="this.src=\`data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ccircle cx='30' cy='30' r='28' fill='%23b89758'/%3E%3Ctext x='30' y='35' text-anchor='middle' font-size='20' fill='white'%3E角%3C/text%3E%3C/svg%3E\`;">
                    <div class="role-info">
                        <h4>${role.name}</h4>
                        <p>${role.background || '暂无详细介绍'}</p>
                        ${isUnavailable ? `<div class="role-taken-by">已被 ${takenBy} 选择</div>` : ''}
                    </div>
                    ${isSelected ? '<div class="role-status role-status-selected">✓ 已选择</div>' : ''}
                    ${isUnavailable && !isSelected ? '<div class="role-status role-status-taken">已被选</div>' : ''}
                </div>
            `;
        }).join('');

        listContainer.innerHTML = rolesHtml;
        
        // ✅ 更新确认按钮状态
        updateConfirmButton();
        
        // ✅ 更新副标题提示
        const subtitle = document.getElementById('roleModalSubtitle');
        if (myCurrentRoleId) {
            const myRole = availableRoles.find(r => r.roleId === myCurrentRoleId);
            subtitle.innerText = `您当前选择的角色: ${myRole ? myRole.name : '未知'} | 双击可取消选择`;
        } else {
            subtitle.innerText = '单击选择角色，双击已选角色取消选择';
        }

        document.getElementById('roleModal').style.display = 'flex';
    }

    function handleRoleClick(roleId, roleName) {
        const currentUserId = localStorage.getItem('userId');
        
        // ✅ 检查角色是否已被其他玩家选择
        if (currentMode === 'online' && currentRoomId) {
            fetch('/api/online/rooms').then(r => r.json()).then(roomRes => {
                if (roomRes.success && roomRes.data) {
                    const room = roomRes.data.find(r => r.roomId === currentRoomId);
                    if (room && room.players) {
                        const roleTakenByOther = room.players.find(
                            p => p.roleId === roleId && String(p.userId) !== String(currentUserId)
                        );
                        
                        if (roleTakenByOther) {
                            alert(`该角色已被 ${roleTakenByOther.username} 选择，请选择其他角色`);
                            return;
                        }
                        
                        // ✅ 角色可选，执行选择逻辑
                        selectRole(roleId, roleName);
                    }
                }
            });
        } else {
            selectRole(roleId, roleName);
        }
    }

    function selectRole(roleId, roleName) {
        // ✅ 如果点击的是已选择的角色，需要判断是单击还是双击
        if (window.selectedRoleId === roleId) {
            const now = Date.now();
            const lastClick = lastClickTime[roleId] || 0;
            
            if (now - lastClick < 300) {
                // ✅ 双击，取消选择
                window.selectedRoleId = null;
                delete lastClickTime[roleId];
                updateRoleCards();
                updateConfirmButton();
                updateSubtitle();
            } else {
                // ✅ 单击，保持选择状态（等待可能的双击）
                lastClickTime[roleId] = now;
            }
        } else {
            // ✅ 选择新角色
            window.selectedRoleId = roleId;
            lastClickTime[roleId] = Date.now();
            updateRoleCards();
            updateConfirmButton();
            updateSubtitle();
        }
    }

    function handleRoleDoubleClick(roleId) {
        // ✅ 双击取消选择
        if (window.selectedRoleId === roleId) {
            window.selectedRoleId = null;
            delete lastClickTime[roleId];
            updateRoleCards();
            updateConfirmButton();
            updateSubtitle();
        }
    }

    function updateRoleCards() {
        const roleCards = document.querySelectorAll('.role-card');
        roleCards.forEach(card => {
            const cardRoleId = parseInt(card.getAttribute('data-role-id'));
            card.classList.remove('role-selected');
            if (window.selectedRoleId === cardRoleId) {
                card.classList.add('role-selected');
            }
        });
    }

    function updateConfirmButton() {
        const confirmBtn = document.getElementById('confirmRoleBtn');
        confirmBtn.disabled = !window.selectedRoleId;
    }

    function updateSubtitle() {
        const subtitle = document.getElementById('roleModalSubtitle');
        if (window.selectedRoleId) {
            const selectedRole = availableRoles.find(r => r.roleId === window.selectedRoleId);
            subtitle.innerText = `您选择的角色: ${selectedRole ? selectedRole.name : '未知'} | 双击可取消选择`;
        } else {
            subtitle.innerText = '单击选择角色，双击已选角色取消选择';
        }
    }

    window.closeRoleModal = function() {
        document.getElementById('roleModal').style.display = 'none';
    }

    window.confirmSelectedRole = async function() {
        if (!window.selectedRoleId) {
            alert("请先选择一个角色！");
            return;
        }
        
        try {
            const userIdStr = localStorage.getItem('userId');
            if (!userIdStr || userIdStr === "undefined") {
                alert("登录状态已失效，请重新登录！");
                window.location.href = 'login.html';
                return;
            }
            const userId = parseInt(userIdStr);
            const username = localStorage.getItem('loginUsername') || '玩家';
            
            // ✅ 获取角色名称
            const selectedRole = availableRoles.find(r => r.roleId === window.selectedRoleId);
            const roleName = selectedRole ? selectedRole.name : '未知角色';

            // ✅ AI 模式或本地模式：直接更新 UI，不需要 WebSocket
            if (currentMode === 'ai' || !currentRoomId) {
                console.log('[角色选择] 本地/AI模式，直接更新UI:', { roleId: window.selectedRoleId, roleName });
                
                // 获取当前玩家座位
                const seatsContainer = document.getElementById('seatsContainer');
                const mySeat = seatsContainer.querySelector('.player-seat:not(.ai-seat)');
                
                if (mySeat) {
                    // 更新当前玩家的角色显示
                    const roleDiv = mySeat.querySelector('.seat-role');
                    if (roleDiv) {
                        roleDiv.innerText = `🎭 ${roleName}`;
                        roleDiv.style.color = '#ff9966';
                    }
                    
                    // 更新座位样式为已选择
                    mySeat.classList.add('role-selected');
                }
                
                // 如果是AI模式，标记AI座位中已选择的角色
                if (currentMode === 'ai') {
                    const aiSeats = seatsContainer.querySelectorAll('.player-seat.ai-seat');
                    aiSeats.forEach((seat, index) => {
                        const seatRoleName = seat.querySelector('.seat-name')?.textContent?.replace('🤖 ', '');
                        if (seatRoleName === roleName) {
                            seat.classList.add('role-taken');
                            seat.style.opacity = '0.5';
                            seat.querySelector('.seat-role').textContent = '⭕ 已被玩家选择';
                        }
                    });
                }
                
                // 更新按钮显示
                const startBtn = document.getElementById('startGameBtn');
                startBtn.innerText = `🎭 ${roleName}`;
                startBtn.title = '点击重新选择角色';
                startBtn.disabled = false;
                startBtn.style.opacity = '1';
                
                // 关闭弹窗
                closeRoleModal();
                return;
            }

            // ✅ 联机模式：通过 WebSocket 发送角色选择消息
            if (socket && socket.readyState === WebSocket.OPEN) {
                const selectRoleMsg = {
                    type: 'SELECT_ROLE',
                    userId: userId,
                    roomId: currentRoomId,
                    roleId: window.selectedRoleId,
                    roleName: roleName
                };
                socket.send(JSON.stringify(selectRoleMsg));
                console.log('[角色选择] 已发送:', selectRoleMsg);
                
                // ✅ 暂时关闭角色选择弹窗
                closeRoleModal();
            } else {
                alert("WebSocket 未连接，无法选择角色。请刷新页面重试。");
            }
        } catch (error) {
            console.error("[角色选择] 错误:", error);
            alert("选择角色失败：" + error.message);
        }
    }

    // ✅ 房主专用：开始游戏
    window.hostStartGame = async function() {
        console.log('[开始游戏] 按钮被点击');
        if (!isCurrentUserHost()) {
            alert("只有房主才能开始游戏！");
            return;
        }
        console.log('[开始游戏] 身份验证通过，是房主');

        const userIdStr = localStorage.getItem('userId');
        if (!userIdStr || userIdStr === "undefined" || userIdStr === "null") {
            alert("登录状态已失效，请重新登录！");
            window.location.href = 'login.html';
            return;
        }
        const userId = parseInt(userIdStr);
        
        // ✅ 验证userId是否有效
        if (isNaN(userId) || userId <= 0) {
            console.error('[开始游戏] userId无效:', userIdStr);
            alert("用户ID无效，请重新登录！");
            window.location.href = 'login.html';
            return;
        }

        // ✅ AI 模式或本地模式：直接通过 API 开始游戏
        if (currentMode === 'ai' || !currentRoomId) {
            try {
                const modeText = !currentRoomId ? '本地' : 'AI';
                console.log(`[开始游戏] ${modeText}模式，通过API开始游戏...`);
                
                // 检查是否已选择角色
                if (!window.selectedRoleId) {
                    alert("请先选择一个角色！");
                    return;
                }
                
                const startUrl = `${API_BASE}/start?userId=${userId}&scriptId=${targetScriptId}&roleId=${window.selectedRoleId}`;
                console.log('[开始游戏] 请求URL:', startUrl);
                
                const response = await fetch(startUrl, {
                    method: 'POST'
                });

                const result = await response.json();
                console.log('[开始游戏] 响应结果:', result);
                
                if (result.success && result.data) {
                    const gameId = result.data.gameId;
                    console.log('[开始游戏] 游戏创建成功，gameId:', gameId);
                    // 直接跳转，不用alert（异步中alert会阻塞跳转）
                    window.location.assign(`play.html?gameId=${gameId}&scriptId=${targetScriptId}&roleId=${window.selectedRoleId}`);
                } else {
                    alert("❌ 开始游戏失败：" + (result.msg || "未知错误"));
                }
            } catch (error) {
                console.error('[开始游戏] 错误:', error);
                alert("❌ 开始游戏失败：" + error.message);
            }
            return;
        }

        // ✅ 联机模式：通过 WebSocket 发送开始游戏消息
        if (!socket) {
            console.error('[开始游戏] WebSocket 未初始化');
            alert("⚠️ WebSocket 未初始化，请刷新页面重试！");
            return;
        }
        
        if (socket.readyState !== WebSocket.OPEN) {
            console.error('[开始游戏] WebSocket 未连接，当前状态:', socket.readyState);
            alert("⚠️ WebSocket 未连接（状态码：" + socket.readyState + "），请刷新页面重试！");
            return;
        }
        
        const startGameMsg = {
            type: 'START_GAME',
            userId: userId,
            roomId: currentRoomId
        };
        socket.send(JSON.stringify(startGameMsg));
        console.log('[开始游戏] 已发送:', startGameMsg);
        
        // ✅ 显示提示信息
        alert("🚀 游戏即将开始！所有玩家将被引导至游戏页面...");
    }

    window.leaveRoom = function() {
        if(confirm("确定要解散/退出当前房间吗？")) {
            if (refreshTimer) {
                clearInterval(refreshTimer);
            }
            stopChatRefresh();
            window.location.href = `room.html`;
        }
    }

    let chatRefreshTimer = null;

    function setChatInputHint(text, tone) {
        const el = document.getElementById('chatInputHint');
        if (!el) return;
        el.textContent = text || '';
        el.classList.remove('warn', 'err');
        if (tone === 'warn') el.classList.add('warn');
        if (tone === 'err') el.classList.add('err');
    }

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function isLocalhost() {
        return ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
    }

    function ensureMicrophoneAvailable() {
        if (!window.isSecureContext && !isLocalhost()) {
            throw new Error('麦克风功能需要 HTTPS 访问。部署到腾讯云后请使用 HTTPS 域名访问，不能直接用 HTTP 公网 IP。');
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error('当前浏览器不支持麦克风录音，请使用新版 Chrome 或 Edge。');
        }
        if (!window.MediaRecorder) {
            throw new Error('当前浏览器不支持 MediaRecorder 录音。');
        }
    }

    function getSupportedAudioMimeType() {
        const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
        return candidates.find(type => window.MediaRecorder && MediaRecorder.isTypeSupported(type)) || '';
    }

    async function persistRoomChat(userId, username, avatar, content, msgId) {
        const params = new URLSearchParams({
            userId: userId || '0',
            username: username || '我',
            avatar: avatar || '',
            content: content || ''
        });
        if (msgId) params.append('msgId', msgId);
        return fetch(`/api/online/room/${currentRoomId}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params
        });
    }

    async function uploadVoiceBlob(audioBlob) {
        const formData = new FormData();
        const ext = audioBlob.type.includes('ogg') ? 'ogg' : audioBlob.type.includes('mp4') ? 'mp4' : 'webm';
        formData.append('file', audioBlob, `voice_${Date.now()}.${ext}`);
        const response = await fetch('/api/game/upload/voice', {
            method: 'POST',
            body: formData
        });
        const result = await response.json();
        if (!result.success || !result.data) {
            throw new Error(result.msg || '语音上传失败');
        }
        return result.data;
    }

    // ====== 消息去重机制 ======
    let sentMessageIds = new Set();
    let lastMessageId = '';
    
    // ====== Socket 连接逻辑 ======
    let socket = null;

    function initSocket() {
        if (!currentRoomId) {
            console.warn('房间ID为空，跳过Socket连接');
            return;
        }
        
        try {
            // 使用 WebSocket 连接服务器
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            const wsUrl = `${protocol}//${host}/ws`;
            
            console.log('尝试连接 Socket:', wsUrl);
            socket = new WebSocket(wsUrl);
            
            socket.onopen = function() {
                console.log('✅ Socket 连接成功');
                const userId = localStorage.getItem('userId');
                const username = localStorage.getItem('loginUsername');
                
                if (userId && currentRoomId) {
                    // ✅ 加入房间时带上头像，让其他玩家能看到我的头像
                    const avatar = localStorage.getItem('avatarUrl') || '';
                    socket.send(JSON.stringify({
                        type: 'JOIN_ROOM',
                        userId: userId,
                        username: username,
                        avatar: avatar,
                        roomId: currentRoomId
                    }));
                    console.log('[Socket] 已发送 JOIN_ROOM 消息', { userId, username, avatar: avatar || '(空)' });
                }
            };
            
            socket.onmessage = function(event) {
                const msg = JSON.parse(event.data);
                console.log('📥 收到消息:', msg);

                switch(msg.type) {
                    case 'CHAT':
                    case 'SERVER_CHAT':
                        // 去重检查：如果是自己发送的消息且已记录，则跳过
                        const isMe = String(msg.userId) === String(localStorage.getItem('userId'));
                        if (isMe && msg.msgId && sentMessageIds.has(msg.msgId)) {
                            console.log(`📝 WebSocket跳过重复消息: ${msg.msgId}`);
                            break;
                        }
                        addChatMessage(msg.username, msg.content, isMe, msg.msgId);
                        break;
                    case 'ROLE_SELECT':
                        updateRoleSelection(msg.userId, msg.roleId, msg.roleName, msg.username, msg.avatar);
                        break;
                    case 'ROOM_PLAYERS':
                        // ✅ 实时刷新玩家列表（头像+名字+已选角色）——权威数据，强制全量刷新
                        console.log('📥 收到房间玩家列表更新:', msg);
                        if (msg.players && Array.isArray(msg.players)) {
                            lastRoomUISnapshot = JSON.stringify(msg.players);
                            const username = localStorage.getItem('loginUsername') || '玩家';
                            renderOnlineRoomUI(
                                currentTotalSeats || availableRoles.length || 6,
                                username,
                                msg.players.length,
                                msg.players
                            );
                        }
                        break;
                    case 'ROLE_SELECT_RESULT':
                        if (!msg.success) {
                            alert("❌ " + msg.message);
                            // ✅ 选择被拒绝：清除本地选中态，等待服务器权威状态刷新
                            window.selectedRoleId = null;
                            document.querySelectorAll('.pick-role-card.selected').forEach(c => c.classList.remove('selected'));
                            updateConfirmButton();
                            if (currentMode === 'online' && currentRoomId) {
                                const username = localStorage.getItem('loginUsername') || '玩家';
                                updateRoomStatus(6, username, currentRoomId);
                            }
                        }
                        break;
                    case 'PLAYER_JOIN':
                        console.log('玩家加入:', msg);
                        break;
                    case 'START_GAME_RESULT':
                        console.log('[游戏开始] 收到消息:', msg);
                        if (msg.success) {
                            alert("🚀 " + msg.message);
                            
                            // ✅ 停止轮询和聊天刷新
                            if (refreshTimer) clearInterval(refreshTimer);
                            stopChatRefresh();
                            
                            // ✅ 获取自己的 gameId（优先用 playerGameIds，如果没有就用通用的）
                            let gameId = msg.gameId;
                            const currentUserId = localStorage.getItem('userId');
                            if (msg.playerGameIds && currentUserId && msg.playerGameIds[currentUserId]) {
                                gameId = msg.playerGameIds[currentUserId];
                                console.log('[游戏开始] 使用专属 gameId:', gameId);
                            } else {
                                console.log('[游戏开始] 使用通用 gameId:', gameId);
                            }
                            
                            // ✅ 跳转到游戏页面
                            console.log('[游戏开始] 跳转到 play.html?gameId=' + gameId + '&roomId=' + currentRoomId);
                            window.location.href = `play.html?gameId=${gameId}&roomId=${currentRoomId}`;
                        } else {
                            alert("❌ " + msg.message);
                        }
                        break;
                }
            };
            
            socket.onerror = function(error) {
                console.error('❌ Socket 错误:', error);
            };
            
            socket.onclose = function() {
                console.log('🔌 Socket 连接关闭，3秒后尝试重连...');
                setTimeout(initSocket, 3000);
            };
        } catch (error) {
            console.error('❌ 建立 Socket 连接失败:', error);
        }
    }

    function sendSocketMessage(data) {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify(data));
        } else {
            console.warn('Socket 未连接，使用 REST API 发送');
        }
    }

    function addChatMessage(username, content, isMe, msgId) {
        // 去重检查：如果是自己发送的消息且已记录，则跳过
        if (isMe && msgId && sentMessageIds.has(msgId)) {
            console.log(`📝 跳过重复消息: ${msgId}`);
            return;
        }
        // 记录消息ID
        if (msgId) {
            sentMessageIds.add(msgId);
            // 最多保留100条记录，防止内存溢出
            if (sentMessageIds.size > 100) {
                sentMessageIds.clear();
            }
        }
        
        const chatBox = document.getElementById('chatBox');
        const safeUser = escapeHtml(username);
        
        // 检查是否为语音消息（以 [VOICE] 开头）
        const isVoiceMessage = content.startsWith('[VOICE]');
        
        let messageContent = '';
        if (isVoiceMessage) {
            // 解析语音消息格式: [VOICE]base64Data|duration 或 [VOICE]url|duration
            const voiceData = content.substring(7); // 移除 "[VOICE]"
            const parts = voiceData.split('|');
            const voiceSource = parts[0];
            const duration = parts[1] ? parseInt(parts[1]) : 0;
            
            // ✅ 判断是 Base64 还是 URL
            const isBase64 = voiceSource.startsWith('data:audio');
            const audioSrc = isBase64 ? voiceSource : voiceSource;
            
            messageContent = `
                <div class="voice-message" style="display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 8px 12px; background: rgba(255,255,255,0.1); border-radius: 8px; min-width: 120px;" onclick="playVoice('${audioSrc}', this)">
                    <span style="font-size: 24px;">🔊</span>
                    <span style="flex: 1;">${duration}''</span>
                    <div class="voice-playing-indicator" style="display: none;">
                        <span class="playing-bar" style="display: inline-block; width: 3px; height: 15px; margin: 0 1px; background: #ff6600; animation: playingWave 0.6s ease-in-out infinite;"></span>
                        <span class="playing-bar" style="display: inline-block; width: 3px; height: 20px; margin: 0 1px; background: #ff6600; animation: playingWave 0.6s ease-in-out infinite 0.1s;"></span>
                        <span class="playing-bar" style="display: inline-block; width: 3px; height: 12px; margin: 0 1px; background: #ff6600; animation: playingWave 0.6s ease-in-out infinite 0.2s;"></span>
                    </div>
                </div>
            `;
        } else {
            const safeContent = escapeHtml(content);
            messageContent = `<div class="msg-bubble" style="${isMe ? 'background: linear-gradient(135deg, #ff6600, #ff3300); color: #fff;' : ''}">${safeContent}</div>`;
        }
        
        const msgHtml = `
            <div class="msg-item" style="align-items: ${isMe ? 'flex-end' : 'flex-start'}; margin-top: 10px;">
                <div class="msg-name">${safeUser}</div>
                ${messageContent}
            </div>
        `;
        
        chatBox.innerHTML += msgHtml;
        chatBox.scrollTop = chatBox.scrollHeight;

        // ✅ 面板折叠时收到他人消息 → 累计未读角标
        if (!isMe && document.getElementById('container').classList.contains('chat-collapsed')) {
            incrementChatUnread();
        }
    }

    // ====== 房间频道折叠逻辑 ======
    let chatUnreadCount = 0;

    function toggleChatPanel(collapse) {
        const container = document.getElementById('container');
        const currentlyCollapsed = container.classList.contains('chat-collapsed');
        // collapse=true → 折叠；collapse=false → 展开；未传参 → 切换
        const shouldCollapse = collapse === undefined ? !currentlyCollapsed : collapse;

        if (shouldCollapse && !currentlyCollapsed) {
            container.classList.add('chat-collapsed');
            // 折叠时释放输入焦点，防止键盘弹出遮挡
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        } else if (!shouldCollapse && currentlyCollapsed) {
            container.classList.remove('chat-collapsed');
            chatUnreadCount = 0;
            updateChatUnreadBadge();
            // 展开后聚焦输入框
            setTimeout(() => {
                const input = document.getElementById('chatInput');
                if (input && input.disabled === false) input.focus();
            }, 480);
        }
    }

    function incrementChatUnread() {
        chatUnreadCount++;
        updateChatUnreadBadge();
    }

    function updateChatUnreadBadge() {
        const badge = document.getElementById('chatUnreadBadge');
        if (!badge) return;
        if (chatUnreadCount > 0) {
            badge.style.display = 'block';
            badge.textContent = chatUnreadCount > 99 ? '99+' : String(chatUnreadCount);
        } else {
            badge.style.display = 'none';
            badge.textContent = '0';
        }
    }

    // ✅ 更新角色选择状态
    function updateRoleSelection(userId, roleId, roleName, takerUsername, takerAvatar) {
        console.log('[角色选择] 玩家', userId, '选择了角色', roleName);
        const currentUserId = localStorage.getItem('userId');
        const isMe = String(userId) === String(currentUserId);
        
        // ✅ 其他玩家选择角色 → 播放"该角色已被选择"动画
        if (!isMe) {
            animateRoleTaken(roleId, takerUsername, takerAvatar);
        }
        
        // ✅ 检查是否是当前用户
        if (isMe) {
            // ✅ 更新当前用户的按钮
            const startBtn = document.getElementById('startGameBtn');
            const hostStartBtn = document.getElementById('hostStartGameBtn');
            
            if (isCurrentUserHost()) {
                // ✅ 房主：显示角色名，保持可点击（可重新选择）
                startBtn.innerText = `🎭 ${roleName}`;
                startBtn.disabled = false;
                startBtn.style.opacity = '1';
                startBtn.title = '点击重新选择角色';
            } else {
                // ✅ 普通玩家：显示"等待房主开始"

        if (currentMode === 'online' && currentRoomId) {
            const username = localStorage.getItem('loginUsername') || '玩家';
            updateRoomStatus(6, username, currentRoomId);
            
            // ✅ 如果是房主，检查是否所有玩家都已选择角色
            if (isCurrentUserHost()) {
                checkAllPlayersReady();
            }
        }
    }

    function startChatRefresh() {
        chatRefreshTimer = setInterval(() => {
            refreshChatMessages();
        }, 2000);
    }

    function stopChatRefresh() {
        if (chatRefreshTimer) {
            clearInterval(chatRefreshTimer);
            chatRefreshTimer = null;
        }
    }

    window.sendMessage = async function() {
        const input = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const text = input.value.trim();
        if (!text) return;

        const username = localStorage.getItem('loginUsername') || '我';
        const userId = localStorage.getItem('userId') || '0';
        const avatar = localStorage.getItem('avatarUrl') || '';

        if (sendBtn) {
            sendBtn.disabled = true;
            sendBtn.textContent = '发送中';
        }
        input.disabled = true;

        // 生成唯一消息ID（用于去重）
        const msgId = `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;

        try {
            // ✅ 优先使用 WebSocket 发送消息（联机模式）
            if (socket && socket.readyState === WebSocket.OPEN && currentRoomId) {
                // ✅ 先立即显示自己的消息（避免等待服务器回传）
                addChatMessage(username, text, true, msgId);
                
                // 清空输入框
                input.value = '';
                setChatInputHint('');
                
                // 通过 WebSocket 发送给其他玩家（包含消息ID用于去重）
                socket.send(JSON.stringify({
                    type: 'CHAT',
                    roomId: currentRoomId,
                    userId: userId,
                    username: username,
                    avatar: avatar,
                    content: text,
                    msgId: msgId
                }));
                
                // 同时调用 REST API 保存消息，刷新/重连后仍可看到
                persistRoomChat(userId, username, avatar, text, msgId).catch(err => console.error('保存消息失败:', err));
            } else if (currentRoomId) {
                // ✅ WebSocket 未连接时，使用 REST API（联机模式）
                const response = await persistRoomChat(userId, username, avatar, text, msgId);

                const result = await response.json();
                if (result.success) {
                    input.value = '';
                    await refreshChatMessages();
                    setChatInputHint('');
                } else {
                    setChatInputHint(result.msg || '发送失败', 'err');
                }
            } else {
                // ✅ 本地模式：直接显示消息（不发送到服务器）
                addChatMessage(username, text, true, msgId);
                input.value = '';
                setChatInputHint('');
                console.log('[本地模式] 消息已显示（仅本地可见）');
            }
        } catch (error) {
            console.error('发送消息失败:', error);
            setChatInputHint('网络异常，发送失败', 'err');
        } finally {
            input.disabled = false;
            if (sendBtn) {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }
    }

    async function refreshChatMessages() {
        const username = localStorage.getItem('loginUsername') || '我';
        try {
            const response = await fetch(`/api/online/room/${currentRoomId}/messages`);
            const result = await response.json();
            if (result.success && result.data) {
                const messages = result.data;
                const chatBox = document.getElementById('chatBox');
                const lastMsgId = lastMessageId;
                let hasNewMessages = false;
                let newMessagesHtml = '';
                let foundLastMsg = lastMsgId === null;
                
                for (let i = 0; i < messages.length; i++) {
                    const msg = messages[i];
                    const msgId = msg.id || msg.msgId || `${msg.username}-${msg.content}-${i}`;
                    
                    if (msg.username === '系统' || msg.username === 'system') {
                        continue;
                    }
                    
                    if (!foundLastMsg) {
                        if (msgId === lastMsgId) {
                            foundLastMsg = true;
                        }
                        continue;
                    }
                    
                    const isMe = msg.username === username;
                    if (isMe && sentMessageIds.has(msgId)) {
                        continue;
                    }
                    
                    hasNewMessages = true;
                    lastMessageId = msgId;
                    
                    const nm = escapeHtml(msg.username);
                    const ct = escapeHtml(msg.content);
                    const isVoiceMessage = ct.startsWith('[VOICE]');
                    let messageContent = '';
                    
                    if (isVoiceMessage) {
                        const voiceData = ct.substring(7);
                        const parts = voiceData.split('|');
                        const voiceUrl = parts[0];
                        const duration = parts[1] ? parseInt(parts[1]) : 0;
                        messageContent = '<div class="voice-message" style="display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 8px 12px; background: rgba(255,255,255,0.1); border-radius: 8px; min-width: 120px;" onclick="playVoice(\'' + voiceUrl + '\', this)"><span style="font-size: 24px;">🔊</span><span style="flex: 1;">' + duration + '\'\'</span></div>';
                    } else {
                        const style = isMe ? 'background: linear-gradient(135deg, #ff6600, #ff3300); color: #fff;' : '';
                        messageContent = '<div class="msg-bubble" style="' + style + '">' + ct + '</div>';
                    }
                    
                    const alignStyle = isMe ? 'flex-end' : 'flex-start';
                    newMessagesHtml += '<div class="msg-item" style="align-items: ' + alignStyle + '; margin-top: 10px;"><div class="msg-name">' + nm + '</div>' + messageContent + '</div>';
                }
                
                if (hasNewMessages && newMessagesHtml) {
                    chatBox.innerHTML += newMessagesHtml;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    // ✅ 面板折叠时收到新消息 → 累计未读角标
                    const container = document.getElementById('container');
                    if (container && container.classList.contains('chat-collapsed')) {
                        incrementChatUnread();
                    }
                }
            }
        } catch (error) {
            console.error('刷新消息失败:', error);
        }
    }

    // 播放语音消息
    let currentPlayingAudio = null;
    
    function playVoice(audioSrc, element) {
        console.log('[语音播放] 尝试播放:', audioSrc.substring(0, 50) + '...');
        
        // 如果正在播放，则停止
        if (currentPlayingAudio) {
            currentPlayingAudio.pause();
            currentPlayingAudio.currentTime = 0;
            currentPlayingAudio = null;
            // 恢复所有按钮状态
            document.querySelectorAll('.voice-msg').forEach(btn => {
                btn.innerHTML = '🔊';
                btn.style.background = 'rgba(255,255,255,0.1)';
            });
            return;
        }
        
        // ✅ 创建音频对象并播放
        const audio = new Audio();
        
        // ✅ 设置音频源（支持 Base64 和 URL）
        if (audioSrc.startsWith('data:audio')) {
            // Base64 格式
            audio.src = audioSrc;
        } else if (audioSrc.startsWith('blob:')) {
            // Blob URL - 检查是否有效
            try {
                audio.src = audioSrc;
            } catch (e) {
                console.error('[语音播放] Blob URL 无效:', e);
                element.innerHTML = '❌';
                setTimeout(() => {
                    element.innerHTML = '🔊';
                }, 2000);
                return;
            }
        } else {
            // 其他 URL 格式
            audio.src = audioSrc;
        }
        
        currentPlayingAudio = audio;
        
        // 改变按钮状态为播放中
        element.innerHTML = '⏸️';
        element.style.background = 'rgba(0,229,255,0.3)';
        
        // ✅ 添加详细的错误处理
        audio.addEventListener('error', (e) => {
            console.error('[语音播放] 音频加载失败:', e);
            console.error('[语音播放] 错误代码:', audio.error ? audio.error.code : 'unknown');
            console.error('[语音播放] 错误消息:', audio.error ? audio.error.message : 'unknown');
            
            element.innerHTML = '❌';
            element.style.background = 'rgba(255,82,82,0.3)';
            currentPlayingAudio = null;
            
            setTimeout(() => {
                element.innerHTML = '🔊';
                element.style.background = 'rgba(255,255,255,0.1)';
            }, 2000);
        });
        
        // ✅ 使用 Promise 方式播放
        audio.play().then(() => {
            console.log('[语音播放] 开始播放');
        }).catch(err => {
            console.error('[语音播放] 播放失败:', err);
            element.innerHTML = '❌';
            element.style.background = 'rgba(255,82,82,0.3)';
            currentPlayingAudio = null;
            
            setTimeout(() => {
                element.innerHTML = '🔊';
                element.style.background = 'rgba(255,255,255,0.1)';
            }, 2000);
        });
        
        // 播放结束后恢复状态
        audio.onended = () => {
            console.log('[语音播放] 播放结束');
            element.innerHTML = '🔊';
            element.style.background = 'rgba(255,255,255,0.1)';
            currentPlayingAudio = null;
        };
    }
    
    // ========== 录音和语音功能 ==========
    
    // 录音相关变量
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingStartTime = 0;
    let recordingTimer = null;
    let isRecording = false;
    let isStopping = false; // 防止重复停止的标志
    
    // 初始化录音按钮事件
    function initVoiceButtons() {
        const recordBtn = document.getElementById('recordVoiceBtn');
        if (recordBtn) {
            recordBtn.addEventListener('click', toggleRecording);
        }
        
        const voskBtn = document.getElementById('voskVoiceBtn');
        if (voskBtn) {
            voskBtn.addEventListener('click', toggleVoskVoice);
        }
    }
    
    // 切换录音状态
    async function toggleRecording() {
        const recordBtn = document.getElementById('recordVoiceBtn');
        
        if (isRecording) {
            stopRecording();
        } else {
            await startRecording();
        }
    }
    
    // 开始录音
    async function startRecording() {
        const recordBtn = document.getElementById('recordVoiceBtn');
        
        try {
            ensureMicrophoneAvailable();

            // 请求麦克风权限
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

            // 创建录音器
            const mimeType = getSupportedAudioMimeType();
            mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
            audioChunks = [];
            
            // 收集音频数据
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    audioChunks.push(e.data);
                }
            };
            
            // 录音停止时的处理
            mediaRecorder.onstop = async () => {
                // 防止重复执行
                if (isStopping) {
                    console.log('[录音] 已在停止过程中，忽略重复调用');
                    return;
                }
                isStopping = true;
                
                try {
                    const audioType = mediaRecorder && mediaRecorder.mimeType ? mediaRecorder.mimeType : 'audio/webm';
                    const audioBlob = new Blob(audioChunks, { type: audioType });
                    await sendVoiceMessage(audioBlob);
                } catch (error) {
                    console.error('[录音] 发送语音消息失败:', error);
                    alert('发送语音消息失败: ' + error.message);
                } finally {
                    // 重置标志
                    isStopping = false;
                }
                
                // 停止所有轨道
                stream.getTracks().forEach(track => track.stop());
            };
            
            // 开始录音
            mediaRecorder.start(100); // 每100ms发送一次数据
            recordingStartTime = Date.now();
            isRecording = true;
            
            // 更新按钮状态
            recordBtn.classList.add('recording-active');
            recordBtn.innerHTML = '⏹️';
            recordBtn.title = '点击停止录音';
            
            // 启动录音计时器（5秒后自动停止）
            recordingTimer = setTimeout(() => {
                if (isRecording) {
                    console.log('[录音] 录音超时，自动停止');
                    stopRecording();
                }
            }, 5000);
            
            console.log('[录音] 开始录音');
            
        } catch (error) {
            console.error('[录音] 启动录音失败:', error);
            
            if (error.name === 'NotAllowedError') {
                alert('麦克风权限被拒绝，请允许麦克风权限后重试');
            } else if (error.name === 'NotFoundError') {
                alert('未检测到麦克风设备');
            } else {
                alert('无法启动录音: ' + error.message);
            }
        }
    }
    
    // 停止录音
    function stopRecording() {
        const recordBtn = document.getElementById('recordVoiceBtn');
        
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            console.log('[录音] 正在停止录音...');
            mediaRecorder.stop();
        } else {
            console.log('[录音] 录音器未处于录音状态，无需停止');
        }
        
        // 清除计时器
        if (recordingTimer) {
            clearTimeout(recordingTimer);
            recordingTimer = null;
        }
        
        isRecording = false;
        
        // 恢复按钮状态
        if (recordBtn) {
            recordBtn.classList.remove('recording-active');
            recordBtn.innerHTML = '🎙️';
            recordBtn.title = '点击录音5秒后自动发送';
        }
        
        console.log('[录音] 停止录音完成');
    }
    
    // 发送语音消息
    async function sendVoiceMessage(audioBlob) {
        const username = localStorage.getItem('loginUsername') || '我';
        const userId = localStorage.getItem('userId') || '0';
        const avatar = localStorage.getItem('avatarUrl') || '';
        const duration = Math.max(1, Math.round((Date.now() - recordingStartTime) / 1000));
        
        console.log('[语音] 准备发送语音消息，时长:', duration, '秒');
        
            try {
            // ✅ 先上传语音文件到服务器，再用 URL 发送（刷新/重连后仍可播放）
            const voiceUrl = await uploadVoiceBlob(audioBlob);
            const msgId = `voice_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            const voiceContent = `[VOICE]${voiceUrl}|${duration}`;

            if (socket && socket.readyState === WebSocket.OPEN && currentRoomId) {
                socket.send(JSON.stringify({
                    type: 'CHAT',
                    roomId: currentRoomId,
                    userId: userId,
                    username: username,
                    content: voiceContent,
                    msgId: msgId
                }));
                addChatMessage(username, voiceContent, true, msgId);
                persistRoomChat(userId, username, avatar, voiceContent, msgId).catch(err =>
                    console.error('保存语音消息失败:', err));
            } else if (currentRoomId) {
                const response = await persistRoomChat(userId, username, avatar, voiceContent, msgId);
                const result = await response.json();
                if (result.success) {
                    addChatMessage(username, voiceContent, true, msgId);
                } else {
                    console.error('[语音] 保存失败:', result.msg);
                }
            } else {
                addChatMessage(username, voiceContent, true, msgId);
            }
        } catch (error) {
            console.error('[语音] 发送失败:', error);
            alert('语音消息发送失败: ' + error.message);
        }
    }
    
    // 将 Blob 转换为 Base64
    function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    
    // ✅ Vosk 离线语音转文字功能（通过后端 Python 服务）
    let isVoskRecording = false;
    let voskAudioContext = null;
    let voskMediaStream = null;
    let voskMediaStreamSource = null;
    let voskScriptProcessor = null;
    let voskRecordedBuffers = [];
    let voskMediaRecorder = null;
    let voskRecordedData = [];
    
    // WAV 编码相关
    function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
        }
    }
    
    function floatTo16BitPCM(output, offset, input) {
        for (let i = 0; i < input.length; i++, offset += 2) {
            let s = Math.max(-1, Math.min(1, input[i]));
            output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
    }
    
    function encodeWAV(samples, sampleRate) {
        let buffer = new ArrayBuffer(44 + samples.length * 2);
        let view = new DataView(buffer);
        
        // RIFF identifier
        writeString(view, 0, 'RIFF');
        // file length
        view.setUint32(4, 36 + samples.length * 2, true);
        // RIFF type
        writeString(view, 8, 'WAVE');
        // format chunk identifier
        writeString(view, 12, 'fmt ');
        // format chunk length
        view.setUint32(16, 16, true);
        // sample format (raw)
        view.setUint16(20, 1, true);
        // channel count
        view.setUint16(22, 1, true);
        // sample rate
        view.setUint32(24, sampleRate, true);
        // byte rate (sample rate * block align)
        view.setUint32(28, sampleRate * 2, true);
        // block align (channel count * bytes per sample)
        view.setUint16(32, 2, true);
        // bits per sample
        view.setUint16(34, 16, true);
        // data chunk identifier
        writeString(view, 36, 'data');
        // data chunk length
        view.setUint32(40, samples.length * 2, true);
        
        floatTo16BitPCM(view, 44, samples);
        
        return new Blob([view], { type: 'audio/wav' });
    }

    async function toggleVoskVoice() {
        const voskBtn = document.getElementById('voskVoiceBtn');
        const chatInput = document.getElementById('chatInput');
        
        if (!voskBtn || !chatInput) {
            console.warn('[Vosk] 按钮或输入框未找到');
            return;
        }
        
        if (isVoskRecording) {
            // 停止录音并发送到后端识别
            stopVoskRecording();
        } else {
            // 开始录音
            await startVoskRecording();
        }
    }

    async function startVoskRecording() {
        const voskBtn = document.getElementById('voskVoiceBtn');
        const chatInputHint = document.getElementById('chatInputHint');
        
        try {
            ensureMicrophoneAvailable();

            // 请求麦克风权限
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    sampleRate: 16000,
                    channelCount: 1,
                    echoCancellation: true,
                    noiseSuppression: true
                }
            });
            voskMediaStream = stream;
            
            // 创建 AudioContext
            voskAudioContext = new (window.AudioContext || window.webkitAudioContext)({
                sampleRate: 16000
            });
            
            // 创建媒体流源
            voskMediaStreamSource = voskAudioContext.createMediaStreamSource(stream);
            
            // 创建 ScriptProcessorNode 已废弃，但我们使用它来直接录制 WAV 格式，避免转换
            voskScriptProcessor = voskAudioContext.createScriptProcessor(4096, 1, 1);
            voskScriptProcessor.connect(voskAudioContext.destination);
            
            voskMediaStreamSource.connect(voskScriptProcessor);
            
            // 创建原始音频缓冲区
            voskRecordedBuffers = [];
            
            voskScriptProcessor.onaudioprocess = (e) => {
                const inputData = e.inputBuffer.getChannelData(0);
                voskRecordedBuffers.push(new Float32Array(inputData));
            };
            
            console.log('[Vosk] 开始录音 (ScriptProcessor 方式，直接录制 16kHz 单声道)');
            
            isVoskRecording = true;
            
            // 更新UI状态
            voskBtn.classList.add('recording-active');
            voskBtn.innerHTML = '⏹️';
            voskBtn.title = '点击停止并识别';
            setChatInputHint('🎤 正在录音... 再次点击停止', 'recording');
            
            console.log('[Vosk] 开始录音 (MediaRecorder 方式)');
            
        } catch (error) {
            console.error('[Vosk] 录音失败:', error);
            
            if (error.name === 'NotAllowedError') {
                alert('❌ 请允许使用麦克风权限以使用语音识别功能');
            } else if (error.name === 'NotFoundError') {
                alert('❌ 未检测到麦克风设备');
            } else {
                alert('❌ 录音失败: ' + error.message);
            }
        }
    }

    function float32ToWav(buffers, sampleRate) {
        // 合并所有缓冲区
        let totalLength = 0;
        for (let i = 0; i < buffers.length; i++) {
            totalLength += buffers[i].length;
        }
        
        const samples = new Float32Array(totalLength);
        let offset = 0;
        for (let i = 0; i < buffers.length; i++) {
            samples.set(buffers[i], offset);
            offset += buffers[i].length;
        }
        
        // 创建 WAV 文件
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        
        // WAV 头部
        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + samples.length * 2, true);
        writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, 'data');
        view.setUint32(40, samples.length * 2, true);
        
        // 音频数据 (float32 -&gt; int16)
        floatTo16BitPCM(view, 44, samples);
        
        return new Blob([buffer], { type: 'audio/wav' });
    }
    
    function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
        }
    }
    
    function floatTo16BitPCM(output, offset, input) {
        for (let i = 0; i < input.length; i++, offset += 2) {
            const s = Math.max(-1, Math.min(1, input[i]));
            output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
    }

    function stopVoskRecording() {
        if (isVoskRecording) {
            isVoskRecording = false;
            
            // 更新UI状态
            const voskBtn = document.getElementById('voskVoiceBtn');
            if (voskBtn) {
                voskBtn.classList.remove('recording-active');
                voskBtn.innerHTML = '🎤';
                voskBtn.title = '点击开始语音转文字';
            }
            
            // 停止 MediaRecorder
            if (voskMediaRecorder && voskMediaRecorder.state !== 'inactive') {
                voskMediaRecorder.stop();
            }

            // 关闭 AudioContext 和释放资源
            if (voskScriptProcessor) {
                voskScriptProcessor.disconnect();
                voskScriptProcessor = null;
            }
            if (voskMediaStreamSource) {
                voskMediaStreamSource.disconnect();
                voskMediaStreamSource = null;
            }
            if (voskAudioContext) {
                voskAudioContext.close();
                voskAudioContext = null;
            }
            if (voskMediaStream) {
                voskMediaStream.getTracks().forEach(track => track.stop());
                voskMediaStream = null;
            }

            setChatInputHint('', '');
            
            console.log('[Vosk] 停止录音，准备发送识别');
            
            // 发送到后端识别
            sendToVoskRecognition();
        }
    }

    async function sendToVoskRecognition() {
        const chatInput = document.getElementById('chatInput');
        const chatInputHint = document.getElementById('chatInputHint');
        
        if (!voskRecordedBuffers || voskRecordedBuffers.length === 0) {
            console.warn('[Vosk] 没有音频数据');
            return;
        }
        
        try {
            setChatInputHint('🔄 正在识别语音...', 'processing');
            
            // 转换为 WAV 格式
            const audioBlob = float32ToWav(voskRecordedBuffers, 16000);
            
            // 创建 FormData
            const formData = new FormData();
            formData.append('file', audioBlob, 'voice.wav');
            
            console.log('[Vosk] 发送 WAV 文件，大小：', audioBlob.size, '字节');
            
            // 发送到 Java 后端服务进行识别
            const response = await fetch('/api/voice/recognize', {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const result = await response.json();
            const recognizedText = result && result.success && result.data ? (result.data.text || '') : '';
            const cleanedText = recognizedText.replace(/\s+/g, '').trim();

            if (cleanedText) {
                chatInput.value = cleanedText;
                chatInput.focus();
                setChatInputHint('✅ 识别成功！您可以编辑后发送', 'success');
                console.log('[Vosk] 识别结果:', cleanedText);
                setTimeout(() => setChatInputHint('', ''), 3000);
            } else {
                const errorMsg = result && result.msg && result.msg !== '操作成功' ? result.msg : '未能识别到语音内容';
                throw new Error(errorMsg);
            }
        } catch (error) {
            console.error('[Vosk] 识别失败:', error);
            setChatInputHint('❌ 识别失败: ' + error.message, 'err');
            setTimeout(() => setChatInputHint('', ''), 5000);
        } finally {
            voskRecordedBuffers = [];
        }
    }
    // 在页面加载完成后初始化录音按钮
    window.addEventListener('load', () => {
        // 延迟初始化，确保 DOM 已完全加载
        setTimeout(initVoiceButtons, 500);
        
        // ✅ 添加 Enter 键发送消息功能
        const chatInput = document.getElementById('chatInput');
        if (chatInput) {
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }
    });

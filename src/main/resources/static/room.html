<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古建奇案馆 - 剧本大厅 (RPG闯关模式)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif; }
        body { width: 100vw; height: 100vh; background: url("images/4.jpg") no-repeat center center; background-size: cover; display: flex; padding: 20px; overflow: hidden; }

        .sidebar { width: 280px; height: 100%; background: linear-gradient(180deg, rgba(15,26,58,0.9), rgba(26,42,90,0.9)); border-radius: 20px; padding: 40px 20px; display: flex; flex-direction: column; backdrop-filter: blur(10px); z-index: 10;}
        .sidebar-logo { text-align: center; margin-bottom: 50px; }
        .menu-list { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .menu-item { width: 100%; height: 60px; background: transparent; border: none; border-radius: 12px; color: #fff; font-size: 18px; display: flex; align-items: center; padding: 0 20px; gap: 15px; cursor: pointer; transition: 0.3s; opacity: 0.7; }
        .menu-item:hover { opacity: 1; background: rgba(255,255,255,0.1); }

        .main-content { flex: 1; height: 100%; background: rgba(18, 22, 33, 0.9); backdrop-filter: blur(15px); border-radius: 20px; margin-left: 20px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .filter-section { padding: 30px 40px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .header-tabs { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .tabs { display: flex; gap: 30px; }
        .tab-btn { background: none; border: none; color: #aaa; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.3s; padding-bottom: 5px; position: relative; }
        .tab-btn.active { color: #fff; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); width: 20px; height: 4px; background: #ff6600; border-radius: 2px; }
        .search-box { display: flex; align-items: center; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 5px 15px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .search-box input { background: none; border: none; color: #fff; padding: 8px; outline: none; width: 200px; font-size: 14px; }
        .search-box button { background: none; border: none; color: #ff6600; cursor: pointer; font-size: 16px; font-weight: bold; padding: 0 5px; transition: 0.3s; }

        .series-section { padding: 0 40px 15px; background: rgba(0,0,0,0.1); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .series-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; margin-top: 15px; }
        .series-title { font-size: 18px; font-weight: bold; color: #00e5ff; display: flex; align-items: center; gap: 8px; }
        .series-title::before { content: ''; display: inline-block; width: 4px; height: 16px; background: #00e5ff; border-radius: 2px; }
        .series-scroll { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px; }
        .series-scroll::-webkit-scrollbar { height: 6px; }
        .series-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .series-card { min-width: 280px; height: 140px; border-radius: 12px; position: relative; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .series-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,229,255,0.25); border-color: #00e5ff; }
        .series-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; filter: brightness(0.8); }
        .series-card:hover .series-img { transform: scale(1.05); filter: brightness(1); }
        .series-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 15px; pointer-events: none;}
        .series-name { font-size: 18px; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .series-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,229,255,0.8); color: #000; padding: 8px 15px; border-radius: 20px; font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; backdrop-filter: blur(5px);}
        .series-card:hover .series-btn { opacity: 1; }

        .script-grid { flex: 1; padding: 30px 40px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; align-content: start; }
        .script-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 15px; padding: 20px; transition: 0.3s; position: relative; display: block; }
        .script-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); border-color: rgba(255,102,0,0.4); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        .fav-badge { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 16px; z-index: 10; border: 1px solid rgba(255,255,255,0.1); }
        .fav-badge:hover { transform: scale(1.15); }
        .fav-badge.active { background: rgba(255,50,50,0.2); border-color: #ff4d4f; }
        .fav-badge.inactive { color: #fff; opacity: 0.8; }
        .follow-badge { position: absolute; top: 56px; right: 15px; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); border-radius: 14px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 12px; z-index: 10; border: 1px solid rgba(255,255,255,0.1); padding: 0 10px; white-space: nowrap; }
        .follow-badge:hover { transform: scale(1.08); }
        .follow-badge.active { background: rgba(255,102,0,0.2); border-color: #ff6600; color: #ff9900; }
        .follow-badge.inactive { color: #aaa; }
        
        .edit-badge { position: absolute; top: 15px; right: 60px; background: rgba(255,153,0,0.9); backdrop-filter: blur(5px); border-radius: 14px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 12px; z-index: 10; border: 1px solid #ff9900; padding: 0 12px; white-space: nowrap; color: #fff; font-weight: bold; }
        .edit-badge:hover { transform: scale(1.08); background: rgba(255,102,0,1); box-shadow: 0 2px 8px rgba(255,153,0,0.4); }

        .card-top { display: flex; gap: 15px; margin-bottom: 15px; position: relative; }
        .card-cover { width: 90px; height: 120px; border-radius: 8px; background-color: #333; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
        .card-info { flex: 1; padding-right: 35px; }
        .c-title { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .c-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .c-tag { background: rgba(255,255,255,0.1); color: #ccc; font-size: 12px; padding: 3px 6px; border-radius: 4px; }
        .c-meta { font-size: 13px; color: #999; line-height: 1.8; }
        .card-desc { font-size: 13px; color: #aaa; line-height: 1.6; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 42px; }

        .new-bottom-actions { display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; margin-top: 15px; }
        .btn-real-eval { flex: 1; padding: 10px 0; background: #2a2d3e; border: 1px solid #4a4d5e; color: #fff; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.3s; }
        .btn-real-eval:hover { background: #ffcc00; color: #000; border-color: #ffcc00; }
        .btn-real-room { flex: 2; padding: 10px 0; background: linear-gradient(90deg, #ff6600, #ff3300); border: none; color: #fff; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.3s; box-shadow: 0 4px 10px rgba(255,102,0,0.3); }
        .btn-real-room:hover { box-shadow: 0 4px 15px rgba(255,102,0,0.6); transform: translateY(-2px); }

        .campaign-overlay { position: absolute; inset: 0; background: rgba(15, 20, 30, 0.98); backdrop-filter: blur(25px); z-index: 50; display: none; flex-direction: column; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .campaign-header { padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .campaign-title { font-size: 28px; font-weight: bold; color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.3); display: flex; align-items: center; gap: 10px; }
        .campaign-close { font-size: 36px; color: #888; cursor: pointer; transition: 0.3s; background: none; border: none; line-height: 1; }
        .campaign-close:hover { color: #fff; transform: rotate(90deg); }

        .campaign-map-area { flex: 1; position: relative; overflow-x: auto; overflow-y: hidden; display: flex; align-items: center; padding: 0 100px; }

        .map-svg-container { position: absolute; top: 0; left: 0; min-width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }

        .map-path-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 6; stroke-dasharray: 15 15; stroke-linecap: round;}
        .map-path-active { fill: none; stroke: #00e5ff; stroke-width: 6; filter: drop-shadow(0 0 8px #00e5ff); stroke-linecap: round; transition: stroke-dashoffset 1.5s ease-in-out; }

        .nodes-container { display: flex; gap: 180px; position: relative; z-index: 2; align-items: center; padding: 50px 0;}
        .level-node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 15px; width: 180px; flex-shrink: 0; }
        .level-node:nth-child(even) { transform: translateY(100px); }
        .level-node:nth-child(odd) { transform: translateY(-100px); }

        .node-icon-wrapper { width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; border: 4px solid #333; background: #1a1e29; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.3s; overflow: hidden; }
        .node-icon-wrapper img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; filter: grayscale(100%); transition: 0.5s; }
        .node-index { position: absolute; top: -5px; right: -5px; width: 35px; height: 35px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; border: 2px solid #222; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .node-info { text-align: center; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); width: 100%; backdrop-filter: blur(5px); }
        .node-title { font-size: 15px; font-weight: bold; color: #888; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .node-action { width: 100%; padding: 8px 0; border-radius: 8px; font-size: 13px; font-weight: bold; border: none; background: #333; color: #666; cursor: not-allowed; transition: 0.3s; }

        .level-node.completed .node-icon-wrapper { border-color: #ffcc00; box-shadow: 0 0 20px rgba(255,204,0,0.2); }
        .level-node.completed .node-icon-wrapper img { opacity: 1; filter: grayscale(0%); }
        .level-node.completed .node-index { background: #ffcc00; color: #000; border-color: #fff; }
        .level-node.completed .node-title { color: #fff; }
        .level-node.completed .node-action { background: rgba(255,204,0,0.1); color: #ffcc00; border: 1px solid #ffcc00; cursor: pointer; }
        .level-node.completed .node-action:hover { background: #ffcc00; color: #000; }

        .level-node.unlocked .node-icon-wrapper { border-color: #00e5ff; box-shadow: 0 0 30px rgba(0,229,255,0.5); animation: pulse-blue 2s infinite; }
        .level-node.unlocked .node-icon-wrapper img { opacity: 1; filter: grayscale(0%); }
        .level-node.unlocked .node-index { background: #00e5ff; color: #000; border-color: #fff; }
        .level-node.unlocked .node-title { color: #00e5ff; text-shadow: 0 0 5px rgba(0,229,255,0.5); }
        .level-node.unlocked .node-action { background: linear-gradient(90deg, #00b4db, #0083b0); color: #fff; cursor: pointer; box-shadow: 0 4px 10px rgba(0,229,255,0.3); }
        .level-node.unlocked .node-action:hover { transform: scale(1.05); }

        @keyframes pulse-blue { 0% { box-shadow: 0 0 0 0 rgba(0,229,255,0.6); } 70% { box-shadow: 0 0 0 20px rgba(0,229,255,0); } 100% { box-shadow: 0 0 0 0 rgba(0,229,255,0); } }
        .new-unlock-effect .node-icon-wrapper { animation: pop-in 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 1.5s; }
        @keyframes pop-in { 0% { transform: scale(0.5); opacity: 0; filter: brightness(2); } 50% { transform: scale(1.2); opacity: 1; filter: brightness(1.5); box-shadow: 0 0 50px #fff; } 100% { transform: scale(1); opacity: 1; filter: none; } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: rgba(25, 30, 45, 0.95); width: 480px; border-radius: 20px; padding: 35px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 40px rgba(0,0,0,0.6); color: #fff; }
        .modal-title { font-size: 24px; color: #fff; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        .form-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px 15px; border-radius: 10px; outline: none; font-size: 15px; }
        .mode-selector { display: flex; gap: 15px; }
        .mode-card { flex: 1; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); padding: 20px 15px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s; }
        .mode-card.active { border-color: #ff6600; background: rgba(255,102,0,0.1); transform: translateY(-3px); }
        .mode-card.active-ai { border-color: #00e5ff; background: rgba(0,229,255,0.1); transform: translateY(-3px); }
        .mode-icon { font-size: 28px; margin-bottom: 10px; }
        .mode-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .mode-desc { font-size: 12px; color: #888; }
        .star-rating { display: flex; gap: 10px; font-size: 30px; cursor: pointer; justify-content: center; margin-bottom: 20px; }
        .star-btn { color: #ffcc00; transition: 0.2s; }
        .star-btn:hover { transform: scale(1.2); }
        .modal-btns { display: flex; gap: 15px; margin-top: 30px; }
        .btn-cancel { flex: 1; padding: 12px; background: rgba(255,255,255,0.1); border: none; border-radius: 10px; color: #fff; cursor: pointer; font-size: 16px; }
        .btn-confirm { flex: 2; padding: 12px; background: linear-gradient(90deg, #ff6600, #ff3300); border: none; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-confirm.ai-btn { background: linear-gradient(90deg, #00b4db, #0083b0); }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div style="display:flex; align-items:center; justify-content:center; gap:12px;">
            <img src="images/icon.png" alt="logo" style="width:38px; height:38px; border-radius:10px; object-fit:cover; box-shadow: 0 0 10px rgba(255,102,0,0.3);">
            <h2 style="margin:0; font-size:26px; letter-spacing:1px; color:#fff;">古建奇案馆</h2>
        </div>
    </div>
    <div class="menu-list">
        <button class="menu-item" onclick="goToPage('index.html')"><span>🏠</span><span>首页</span></button>
        <button class="menu-item" onclick="goToPage('creator.html')"><span>✒️</span><span>创作者空间</span></button>
        <button class="menu-item" onclick="goToPage('profile.html')"><span>👤</span><span>个人信息</span></button>
    </div>
</div>

<div class="main-content">
    <div class="filter-section">
        <div class="header-tabs">
            <div class="tabs">
                <button class="tab-btn active" id="tabHot" onclick="switchTab(this)">🔥 剧本大厅</button>
                <button class="tab-btn" id="tabFav" onclick="switchTab(this)">❤️ 我的收藏</button>
                <button class="tab-btn" id="tabMy" onclick="switchTab(this)">📝 我的剧本</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索剧本名称..." onkeypress="if(event.key==='Enter') performSearch()">
                <button onclick="performSearch()">🔍</button>
            </div>
        </div>
    </div>

    <div class="series-section" id="seriesSection" style="display: none;">
        <div class="series-header">
            <div class="series-title">🌍 探索独家剧本系列 (RPG模式)</div>
        </div>
        <div class="series-scroll" id="seriesContainer">
        </div>
    </div>

    <div class="script-grid" id="scriptGrid">
        <div style="color:#888; text-align:center; padding-top:50px; grid-column:1/-1;">正在加载剧本数据...</div>
    </div>

    <div class="campaign-overlay" id="campaignOverlay">
        <div class="campaign-header">
            <div class="campaign-title" id="campaignTitle">🗺️ 正在连线矩阵服务器...</div>
            <button class="campaign-close" onclick="closeCampaign()">✖</button>
        </div>
        <div class="campaign-map-area">
            <svg class="map-svg-container" id="mapSvg"></svg>
            <div class="nodes-container" id="campaignNodes">
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="roomModal">
    <div class="modal-content">
        <div class="modal-title">🎲 创建剧本房间</div>
        <div class="form-group">
            <label>当前选择剧本</label>
            <input type="text" id="targetScript" class="form-input" disabled style="color:#aaa; background: rgba(255,255,255,0.05);">
        </div>
        <div class="form-group">
            <label>房间名称</label>
            <input type="text" id="targetRoomName" class="form-input" placeholder="起个吸引人的房间名吧...">
        </div>
        <div class="form-group">
            <label>选择游戏模式</label>
            <div class="mode-selector">
                <div class="mode-card active" id="modeOnline" onclick="selectMode('online')">
                    <div class="mode-icon">🌐</div>
                    <div class="mode-title">在线联机</div>
                    <div class="mode-desc">等待全网真人加入</div>
                </div>
                <div class="mode-card" id="modeAi" onclick="selectMode('ai')">
                    <div class="mode-icon">🤖</div>
                    <div class="mode-title" style="color:#00e5ff;">AI 沉浸</div>
                    <div class="mode-desc">AI大模型扮演车友</div>
                </div>
            </div>
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal('roomModal')">取消</button>
            <button class="btn-confirm" id="confirmCreateBtn" onclick="doCreateRoom()">立即创建房间</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="reviewModal">
    <div class="modal-content" style="width: 600px; max-height: 80vh; overflow-y: auto;">
        <div class="modal-title">⭐ 评价打分</div>
        
        <div class="evaluation-stats" style="display: flex; gap: 20px; margin-bottom: 20px; padding: 10px; background: #f8f8f8; border-radius: 8px;">
            <div><span style="color:#ffcc00; font-size:24px; font-weight:bold;">★</span> <span id="avgScore" style="font-size:20px;">0.0</span></div>
            <div>评价数：<span id="evalCount" style="font-weight:bold;">0</span></div>
        </div>

        <div class="evaluation-list" style="margin-bottom: 20px; max-height: 300px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 10px;">
            <div id="evaluationList">
                <div style="text-align:center; color:#888;">加载中...</div>
            </div>
        </div>

        <div class="form-group">
            <label>正在评价：<span id="reviewTargetScript" style="color:#ff6600; font-weight:bold; font-size:18px;"></span></label>
        </div>
        <div class="star-rating" id="starContainer">
            <span class="star-btn" onclick="setStars(1)">★</span>
            <span class="star-btn" onclick="setStars(2)">★</span>
            <span class="star-btn" onclick="setStars(3)">★</span>
            <span class="star-btn" onclick="setStars(4)">★</span>
            <span class="star-btn" onclick="setStars(5)">★</span>
        </div>
        <div class="form-group">
            <textarea id="reviewContent" class="form-input" rows="4" placeholder="写下你对这个剧本的感受吧..."></textarea>
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal('reviewModal')">取消</button>
            <button class="btn-confirm" onclick="submitReview()">提交评价</button>
        </div>
    </div>
</div>

<script>
    // 全局图片加载失败兜底
    window.addEventListener('error', function(e) {
        if (e.target.tagName === 'IMG') {
            e.target.src = 'https://placehold.co/200/333/666?text=图片加载失败';
        }
    }, true);
    const API_BASE = '/api/game';
    let allDbScripts = [];
    let myFavorites = [];
    let myFollows = [];
    let myCreations = [];
    let currentSelectedScriptId = null;
    let selectedMode = 'online';
    let currentTab = 'hot';

    function goToPage(url) { window.location.href = url; }

    window.onload = async function() {
        const username = localStorage.getItem('loginUsername');
        try {
            loadSeriesBanner();
            if (username) {
                const favRes = await fetch(`${API_BASE}/favorites?username=${encodeURIComponent(username)}`).then(r => r.json());
                if(favRes.success && favRes.data) myFavorites = favRes.data;
                const followRes = await fetch(`/api/user/follows/ids?username=${encodeURIComponent(username)}`).then(r => r.json());
                if(followRes.success && followRes.data) myFollows = followRes.data;
            }
            const res = await fetch(`${API_BASE}/scripts`).then(r => r.json());
            if (res.success) {
                allDbScripts = res.data;
                performSearch();
            } else {
                document.getElementById('scriptGrid').innerHTML = `<div style="color:#ff3333; text-align:center; padding-top:50px; grid-column:1/-1;">后端服务器异常，无法获取剧本：${res.msg || ''}</div>`;
            }
        } catch (e) {
            document.getElementById('scriptGrid').innerHTML = '<div style="color:red; text-align:center; padding-top:50px; grid-column:1/-1;">网络异常，无法连接服务器</div>';
        }
    }

    async function loadSeriesBanner() {
        try {
            const res = await fetch(`${API_BASE}/series/list`).then(r => r.json());
            if (res.success && res.data && res.data.length > 0) {
                document.getElementById('seriesSection').style.display = 'block';
                const container = document.getElementById('seriesContainer');

                let htmlContent = '';
                res.data.forEach(s => {
                    const cover = s.coverUrl || 'https://images.unsplash.com/photo-1599059021750-82716ae2b661?q=80&w=600&auto=format&fit=crop';
                    htmlContent += `
                        <div class="series-card" onclick="openCampaignMap(${s.seriesId})">
                            <img src="${cover}" class="series-img">
                            <div class="series-overlay">
                                <div class="series-name">${s.seriesName}</div>
                                <div class="series-btn">🚀 立即推图</div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = htmlContent;
            }
        } catch (e) { console.error("加载系列失败", e); }
    }

    async function openCampaignMap(seriesId) {
        const username = localStorage.getItem('loginUsername');
        if(!username) { alert("请先登录！"); return; }

        document.getElementById('campaignOverlay').style.display = 'flex';
        document.getElementById('campaignTitle').innerHTML = "🗺️ 正在获取关卡情报...";
        document.getElementById('campaignNodes').innerHTML = "";
        document.getElementById('mapSvg').innerHTML = "";

        try {
            const res = await fetch(`${API_BASE}/series/campaign?seriesId=${seriesId}&username=${encodeURIComponent(username)}`).then(r => r.json());

            if(res.success && res.data) {
                const sInfo = res.data.seriesInfo;
                const levels = res.data.levels;
                document.getElementById('campaignTitle').innerHTML = `🗺️ ${sInfo.seriesName} - 闯关版图`;

                const overlay = document.getElementById('campaignOverlay');
                if (sInfo.backgroundUrl && sInfo.backgroundUrl.trim() !== '') {
                    // ✨ 核心修改：将遮罩透明度大幅调低为 0.2 和 0.4，让背景图清晰明亮 ✨
                    overlay.style.background = `linear-gradient(rgba(15, 20, 30, 0.2), rgba(15, 20, 30, 0.4)), url('${sInfo.backgroundUrl}') no-repeat center center`;
                    overlay.style.backgroundSize = 'cover';
                } else {
                    overlay.style.background = 'rgba(15, 20, 30, 0.98)';
                }

                renderCampaignNodes(levels);

                setTimeout(() => drawConnectingLines(), 450);
            } else {
                document.getElementById('campaignTitle').innerText = "地图加载失败：" + res.msg;
            }
        } catch (e) {
            document.getElementById('campaignTitle').innerText = "网络异常，无法获取地图";
        }
    }

    window.addEventListener('resize', () => {
        if(document.getElementById('campaignOverlay').style.display === 'flex') {
            drawConnectingLines();
        }
    });

    function closeCampaign() { document.getElementById('campaignOverlay').style.display = 'none'; }

    function renderCampaignNodes(levels) {
        const container = document.getElementById('campaignNodes');
        let html = '';

        levels.forEach((lvl, idx) => {
            const isCompleted = lvl.status === 'completed';
            const isUnlocked = lvl.status === 'unlocked';
            let cssClass = isCompleted ? 'completed' : (isUnlocked ? 'unlocked new-unlock-effect' : 'locked');

            const script = lvl.script;
            const coverUrl = script && script.coverUrl ? script.coverUrl : 'https://placehold.co/100/333/666?text=未解锁';
            const title = script ? script.title : '未知关卡';
            const difficulty = script ? script.difficulty : '未知';

            let btnHtml = isCompleted ? `<button class="node-action" onclick="openRoomConfig('${title}', ${script.scriptId})">再次游玩 (已通关)</button>` :
                (isUnlocked ? `<button class="node-action" onclick="openRoomConfig('${title}', ${script.scriptId})">🚀 挑战本关</button>` :
                    `<button class="node-action">🔒 未解锁</button>`);

            html += `
                <div class="level-node ${cssClass}" id="node_${idx}">
                    <div class="node-icon-wrapper" ${isUnlocked || isCompleted ? `onclick="openRoomConfig('${title}', ${script.scriptId})"` : ''}>
                        <img src="${coverUrl}">
                        <div class="node-index">${lvl.levelIndex}</div>
                    </div>
                    <div class="node-info">
                        <div class="node-title" title="${title}">${title}</div>
                        <div class="node-meta">难度: ${difficulty}</div>
                        ${btnHtml}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function drawConnectingLines() {
        const svg = document.getElementById('mapSvg');
        const nodes = document.querySelectorAll('.level-node .node-icon-wrapper');
        const container = document.querySelector('.campaign-map-area');

        if(nodes.length === 0) return;

        const totalWidth = container.scrollWidth;
        svg.style.width = totalWidth + 'px';
        svg.setAttribute('width', totalWidth);
        svg.setAttribute('height', container.clientHeight);

        let pathsHtml = '';

        for (let i = 0; i < nodes.length - 1; i++) {
            const node1 = nodes[i];
            const node2 = nodes[i+1];
            const parent1 = node1.closest('.level-node');

            const rect1 = node1.getBoundingClientRect();
            const rect2 = node2.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const scrollLeft = container.scrollLeft;

            const x1 = rect1.left - containerRect.left + scrollLeft + rect1.width/2;
            const y1 = rect1.top - containerRect.top + rect1.height/2;
            const x2 = rect2.left - containerRect.left + scrollLeft + rect2.width/2;
            const y2 = rect2.top - containerRect.top + rect2.height/2;

            const d = `M ${x1} ${y1} C ${x1 + 100} ${y1}, ${x2 - 100} ${y2}, ${x2} ${y2}`;
            const isPathActive = parent1.classList.contains('completed');

            pathsHtml += `<path class="map-path-bg" d="${d}" />`;
            if (isPathActive) {
                pathsHtml += `<path class="map-path-active" d="${d}" />`;
            }
        }

        svg.innerHTML = pathsHtml;

        const activePaths = document.querySelectorAll('.map-path-active');
        activePaths.forEach((p, idx) => {
            const length = p.getTotalLength();
            p.style.strokeDasharray = length;
            p.style.strokeDashoffset = length;
            setTimeout(() => { p.style.strokeDashoffset = 0; }, idx * 500);
        });
    }

    async function switchTab(element) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('searchInput').value = '';
        if (element.id === 'tabMy') {
            currentTab = 'my';
            const username = localStorage.getItem('loginUsername');
            try {
                const res = await fetch(`/api/user/records/creation?username=${encodeURIComponent(username)}`).then(r => r.json());
                if(res.success) myCreations = res.data;
            } catch(e) {}
        } else if (element.id === 'tabFav') { currentTab = 'fav'; }
        else { currentTab = 'hot'; }
        performSearch();
    }

    function performSearch() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        let targetList = currentTab === 'hot' ? allDbScripts : (currentTab === 'fav' ? allDbScripts.filter(s => myFavorites.includes(parseInt(s.scriptId || s.script_id || s.id))) : myCreations);
        renderScriptsDOM(targetList.filter(s => (s.title || s.script_name || '').toLowerCase().includes(keyword)));
    }

    function renderScriptsDOM(scripts) {
        const grid = document.getElementById('scriptGrid');
        if (!scripts || scripts.length === 0) { grid.innerHTML = '<div style="color:#888; text-align:center; grid-column:1/-1; padding-top:50px;">没有找到匹配的剧本~</div>'; return; }
        let html = '';
        scripts.forEach((s, index) => {
            const actualId = parseInt(s.scriptId || s.script_id || s.id);
            const title = s.title || s.script_name || '未命名';
            const safeTitle = title.replace(/'/g, "\\'").replace(/"/g, "&quot;");
            const creatorName = s.creatorName || s.creator_name || '暗区兵王';
            const tagsList = (s.tags || '热门').split(',').map(t => t.trim()).filter(t => t && t !== '原创制作');
            const tagsHtml = `<span class="c-tag" style="background: linear-gradient(90deg, rgba(0,229,255,0.2), rgba(0,229,255,0.1)); border-color: rgba(0,229,255,0.3); color: #00e5ff;">👤 ${creatorName}</span>` + tagsList.map(t => `<span class="c-tag">${t}</span>`).join('');
            const coverUrl = s.coverUrl || s.cover_url || 'https://placehold.co/90x120/1e2638/00e5ff?text=封面';

            const isFav = myFavorites.includes(actualId);
            const favIcon = isFav ? '❤️' : '🤍';
            const favClass = isFav ? 'fav-badge active' : 'fav-badge inactive';

            const creatorUserId = s.userId != null ? parseInt(s.userId) : (s.user_id != null ? parseInt(s.user_id) : null);
            const currentUserId = localStorage.getItem('userId');
            const currentUserIdNum = currentUserId != null ? parseInt(currentUserId) : null;
            const isAuthor = currentUserIdNum != null && creatorUserId != null && currentUserIdNum === creatorUserId;
            
            const editBtnHtml = isAuthor ? `<div class="edit-badge" onclick="goToPage('creator.html?scriptId=${actualId}')">✎ 编辑</div>` : '';
            
            const isFollowed = !isAuthor && creatorUserId != null && myFollows.some(fid => parseInt(fid) === creatorUserId);
            const followLabel = isFollowed ? '✓ 已关注' : '＋关注';
            const followClass = isFollowed ? 'follow-badge active' : 'follow-badge inactive';
            const followBtnHtml = !isAuthor && creatorUserId != null ? `<div class="${followClass}" onclick="toggleFollowCreator(${creatorUserId})">${followLabel}</div>` : '';

            html += `
            <div class="script-card">
                <div class="${favClass}" onclick="toggleFavorite(${actualId})">${favIcon}</div>
                ${editBtnHtml}
                ${followBtnHtml}
                <div class="card-top">
                    <div class="card-cover" style="background: url('${coverUrl}') center/cover, #444;"></div>
                    <div class="card-info">
                        <div class="c-title" title="${safeTitle}">${safeTitle}</div>
                        <div class="c-tags">${tagsHtml}</div>
                        <div class="c-meta">
                            <div>难度：<span class="c-stars">${s.difficulty || '未知'}</span></div>
                            <div>配置：${s.playerCount || s.player_count || s.config || 5}人</div>
                            <div>评分：<span style="color:#ffcc00; font-weight:bold;">★ ${s.score ? parseFloat(s.score).toFixed(1) : '暂无'}</span></div>
                        </div>
                    </div>
                </div>
                <div class="card-desc">${s.intro || s.script_desc || '暂无简介'}</div>
                <div class="new-bottom-actions">
                    <button class="btn-real-eval" onclick="openReviewModal('${actualId}', '${safeTitle}')">⭐ 评价</button>
                    <button class="btn-real-room" onclick="openRoomConfig('${safeTitle}', '${actualId}')">🎲 创建房间</button>
                </div>
            </div>`;
        });
        grid.innerHTML = html;
    }

    async function toggleFavorite(scriptId) {
        const username = localStorage.getItem('loginUsername');
        if(!username) return;
        const res = await fetch(`${API_BASE}/favorite`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username, scriptId: parseInt(scriptId) }) }).then(r => r.json());
        if(res.success) {
            if (res.data.includes("取消")) myFavorites = myFavorites.filter(id => id !== parseInt(scriptId));
            else myFavorites.push(parseInt(scriptId));
            performSearch();
        }
    }

    async function toggleFollowCreator(followedUserId) {
        const username = localStorage.getItem('loginUsername');
        if (!username) { alert("请先登录！"); return; }
        if (!followedUserId) { alert("创作者信息未完善"); return; }

        const userIdNum = parseInt(followedUserId);
        if (isNaN(userIdNum)) { alert("无效的用户ID"); return; }

        const res = await fetch(`/api/user/follow`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username, followedUserId: userIdNum }) }).then(r => r.json());
        if (res.success) {
            if (res.data.includes("取消")) {
                myFollows = myFollows.filter(id => parseInt(id) !== userIdNum);
            } else {
                myFollows.push(userIdNum);
            }
            performSearch();
        } else {
            alert(res.msg || "关注失败");
        }
    }

    function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
    function selectMode(mode) {
        selectedMode = mode;
        const onlineCard = document.getElementById('modeOnline'), aiCard = document.getElementById('modeAi'), confirmBtn = document.getElementById('confirmCreateBtn');
        if (mode === 'online') {
            onlineCard.classList.add('active'); aiCard.classList.remove('active-ai');
            confirmBtn.className = 'btn-confirm'; confirmBtn.innerText = '立即创建房间';
        } else {
            onlineCard.classList.remove('active'); aiCard.classList.add('active-ai');
            confirmBtn.className = 'btn-confirm ai-btn'; confirmBtn.innerText = '开启 AI 沉浸局';
        }
    }

    function openRoomConfig(scriptName, scriptId) {
        document.getElementById('targetScript').value = scriptName;
        document.getElementById('targetRoomName').value = `${scriptName} 专车发车！`;
        currentSelectedScriptId = scriptId;
        document.getElementById('roomModal').style.display = 'flex';
        selectMode('online');
    }

    async function doCreateRoom() {
        const roomName = document.getElementById('targetRoomName').value;
        const username = localStorage.getItem('loginUsername') || '玩家';
        const userId = localStorage.getItem('userId') || '1';
        const scriptName = document.getElementById('targetScript').value;
        if(!roomName.trim()) { alert("房间名不能为空！"); return; }
        closeCampaign();
        
        if (selectedMode === 'online') {
            try {
                // ✅ 创建房间时带上头像，让其他玩家能看到房主头像
                const avatar = localStorage.getItem('avatarUrl') || '';
                // 联机模式：调用API创建真实房间
                const createRes = await fetch('/api/online/room/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `userId=${encodeURIComponent(userId)}&username=${encodeURIComponent(username)}&scriptId=${currentSelectedScriptId}&roomName=${encodeURIComponent(roomName)}&avatar=${encodeURIComponent(avatar)}`
                }).then(r => r.json());
                
                if (createRes.success && createRes.data) {
                    // 房间创建成功，跳转到游戏房间页面
                    window.location.href = `game-room.html?username=${encodeURIComponent(username)}&script=${encodeURIComponent(scriptName)}&scriptId=${currentSelectedScriptId}&roomId=${createRes.data.roomId}&roomName=${encodeURIComponent(roomName)}&mode=${selectedMode}`;
                } else {
                    alert("创建房间失败：" + (createRes.msg || "未知错误"));
                }
            } catch (e) {
                console.error("创建房间失败", e);
                alert("创建房间失败，请稍后重试！");
            }
        } else {
            // AI模式或本地模式：直接跳转
            window.location.href = `game-room.html?username=${encodeURIComponent(username)}&script=${encodeURIComponent(scriptName)}&scriptId=${currentSelectedScriptId}&roomName=${encodeURIComponent(roomName)}&mode=${selectedMode}`;
        }
    }

    function openReviewModal(scriptId, scriptName) {
        currentSelectedScriptId = scriptId;
        document.getElementById('reviewTargetScript').innerText = scriptName;
        document.getElementById('reviewContent').value = '';
        setStars(5);
        loadEvaluations(scriptId);
        document.getElementById('reviewModal').style.display = 'flex';
    }

    async function loadEvaluations(scriptId) {
        try {
            const res = await fetch(`${API_BASE}/evaluations?scriptId=${scriptId}`).then(r => r.json());
            if (res.success) {
                document.getElementById('avgScore').textContent = res.data.averageScore || '暂无';
                document.getElementById('evalCount').textContent = res.data.count || 0;
                
                const evaluations = res.data.evaluations || [];
                if (evaluations.length > 0) {
                    let html = '';
                    evaluations.forEach(e => {
                        const nickname = e.nickname || '匿名用户';
                        const score = e.score || 0;
                        const content = e.content || '暂无评价内容';
                        const time = e.create_time || e.createTime || '';
                        
                        let starsHtml = '';
                        for (let i = 0; i < 5; i++) {
                            starsHtml += `<span style="color: ${i < score ? '#ffcc00' : '#ddd'};">★</span>`;
                        }
                        
                        html += `
                            <div style="border-bottom: 1px dashed #eee; padding: 10px 0;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                                    <span style="font-weight:bold; color:#333;">${nickname}</span>
                                    <span style="color:#999; font-size:12px;">${time}</span>
                                </div>
                                <div style="color:#ffcc00; margin-bottom: 5px;">${starsHtml}</div>
                                <div style="color:#666; font-size:14px;">${content}</div>
                            </div>
                        `;
                    });
                    document.getElementById('evaluationList').innerHTML = html;
                } else {
                    document.getElementById('evaluationList').innerHTML = '<div style="text-align:center; color:#888;">暂无评价，快来发表第一个评价吧！</div>';
                }
            }
        } catch (error) {
            console.error('加载评价失败:', error);
            document.getElementById('evaluationList').innerHTML = '<div style="text-align:center; color:#ff6600;">加载评价失败</div>';
        }
    }

    function setStars(score) {
        currentReviewScore = score;
        document.querySelectorAll('#starContainer .star-btn').forEach((star, i) => { star.style.color = i < score ? '#ffcc00' : '#555'; });
    }

    async function submitReview() {
        const username = localStorage.getItem('loginUsername');
        const content = document.getElementById('reviewContent').value.trim();
        if(!username || !content) return;
        const res = await fetch(`${API_BASE}/evaluate`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username, scriptId: parseInt(currentSelectedScriptId), scriptName: document.getElementById('reviewTargetScript').innerText, score: currentReviewScore, content: content }) }).then(r => r.json());
        if(res.success) { 
            alert("评价成功！"); 
            loadEvaluations(currentSelectedScriptId);
            document.getElementById('reviewContent').value = '';
            setStars(5);
        }
    }
</script>
</body>
</html>

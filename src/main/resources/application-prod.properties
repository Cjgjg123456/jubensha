# 数据库配置 - MySQL生产环境
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/jubensha?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true&maxReconnects=3
spring.datasource.username=jubensha
spring.datasource.password=Jubensha@2024

# 编码配置 - 确保 UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# 静态资源配置
spring.web.resources.static-locations=classpath:/static/,file:/opt/jubensha_uploads/
spring.mvc.static-path-pattern=/**
# 生产环境缓存设置（7天）
spring.web.resources.cache.period=604800

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.jubensha.entity
mybatis.configuration.map-underscore-to-camel-case=true
# 生产环境关闭SQL日志输出
# mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 数据库连接池配置优化（适配2核1GB小内存服务器）
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JVM内存配置（建议在启动参数中设置：-Xmx512m -Xms256m，适配1GB内存服务器）

# Spring缓存配置
spring.cache.type=simple

# 服务器配置
server.port=8080
server.servlet.context-path=/

# 允许 bean 定义覆盖
spring.main.allow-bean-definition-overriding=true

# 设置上传文件保存的物理磁盘路径 (注意末尾的斜杠)
file.upload-path=/opt/jubensha_uploads/

# 联机服务器配置
game.server.ip=0.0.0.0
game.server.port=8889
game.server.public-ip=150.158.11.253
game.server.public-port=8889
game.server.max-players-per-room=6

# 客户端连接配置（用于公网联机）
game.client.server-ip=${game.server.public-ip}
game.client.server-port=${game.server.public-port}

# 允许上传的单个文件最大体积 (设置为 50MB)
spring.servlet.multipart.max-file-size=50MB

# 单次 HTTP 请求的最大体积 (设置为 100MB)
spring.servlet.multipart.max-request-size=100MB

# ====================
# Python 语音转文字服务配置
# ====================
# 是否启用 Python 中间层服务
voice.python.enabled=true
# Python 服务地址
voice.python.host=localhost
# Python 服务端口
voice.python.port=5000
# 请求超时时间 (秒)
voice.python.timeout=30

# ====================
# 数据清理配置（天数）
# ====================
cleanup.browse-retention-days=30
cleanup.game-retention-days=30
cleanup.voice-retention-days=7

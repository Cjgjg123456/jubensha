# ====================
# API 密钥配置（通过环境变量注入，不要硬编码）
# ====================
# 火山引擎 TTS
volcano.tts.app-id=${VOLCANO_TTS_APP_ID:}
volcano.tts.access-token=${VOLCANO_TTS_TOKEN:}
volcano.tts.voice-type=${VOLCANO_TTS_VOICE:zh_male_linjiananhai_moon_bigtts}

# DeepSeek AI（代码内通过环境变量读取）
deepseek.api-key=${DEEPSEEK_API_KEY:}

# 数据库配置 - 使用 SQLite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:./jubensha/example_db.sqlite?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000
spring.datasource.username=admin
spring.datasource.password=password

# 编码配置 - 确保 UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# 静态资源配置
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
spring.web.resources.cache.period=3600

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.jubensha.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 数据库连接池配置优化
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1

# Spring缓存配置
spring.cache.type=simple

# 服务器配置
server.port=8080
server.servlet.context-path=/

# 允许 bean 定义覆盖
spring.main.allow-bean-definition-overriding=true

# 上传文件路径
file.upload-path=${user.dir}/uploads/

# 联机服务器配置
game.server.ip=localhost
game.server.port=8888
game.server.public-ip=${GAME_PUBLIC_IP:11.tcp.cpolar.top}
game.server.public-port=${GAME_PUBLIC_PORT:14220}
game.server.http-public-url=${GAME_HTTP_URL:http://5ff7cc2.r11.cpolar.top}
game.server.max-players-per-room=6

game.client.server-ip=${game.server.ip}
game.client.server-port=${game.server.port}

# 上传限制
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

# Python 语音转文字服务
voice.python.enabled=true
voice.python.host=localhost
voice.python.port=5000
voice.python.timeout=30

# 数据清理配置（天数）
cleanup.browse-retention-days=30
cleanup.game-retention-days=30
cleanup.voice-retention-days=7

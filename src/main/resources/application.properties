# 数据库配置 - 使用 SQLite
# 尝试多个可能的路径
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:./jubensha/example_db.sqlite
spring.datasource.username=admin
spring.datasource.password=password

# 编码配置 - 确保 UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# 静态资源配置
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
# 静态资源缓存（秒）- 开发环境设为3600（1小时）
spring.web.resources.cache.period=3600

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.jubensha.entity
mybatis.configuration.map-underscore-to-camel-case=true
# 生产环境关闭SQL日志输出
# mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 数据库连接池配置优化
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Spring缓存配置
spring.cache.type=simple

# 服务器配置
server.port=8080
server.servlet.context-path=/

# 允许 bean 定义覆盖
spring.main.allow-bean-definition-overriding=true

# 设置上传文件保存的物理磁盘路径 (注意末尾的斜杠)
file.upload-path=${user.dir}/uploads/

# 联机服务器配置
game.server.ip=localhost
game.server.port=8888
game.server.public-ip=11.tcp.cpolar.top
game.server.public-port=14220
game.server.http-public-url=http://5ff7cc2.r11.cpolar.top
game.server.max-players-per-room=6

# 客户端连接配置（用于公网联机）
game.client.server-ip=${game.server.ip}
game.client.server-port=${game.server.port}

# 允许上传的单个文件最大体积 (设置为 50MB，足够传高清音乐了)
spring.servlet.multipart.max-file-size=50MB

# 单次 HTTP 请求的最大体积 (设置为 100MB)
spring.servlet.multipart.max-request-size=100MB

# ====================
# Python 语音转文字服务配置
# ====================
# 是否启用 Python 中间层服务
voice.python.enabled=true
# Python 服务地址
voice.python.host=localhost
# Python 服务端口
voice.python.port=5000
# 请求超时时间 (秒)
voice.python.timeout=30
